# Delta CRM em Docker — teste local e produção usam este mesmo arquivo.
#   Subir:    docker compose up -d --build
#   Parar:    docker compose down          (os dados ficam guardados)
#   Ver logs: docker compose logs -f app
name: delta-crm
services:
  app:
    build: { context: ., dockerfile: servidor/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm
      GOTENBERG_URL: http://pdf:3000
      BACKUP_DIR: /backups
      TARIFA_CSV_URL: ${TARIFA_CSV_URL:-}
    ports: ["8080:8080"]
    volumes: ["./backups:/backups"]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["dados:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      retries: 20

  # Backup automático do banco: todo dia, guarda 30 diários + 8 semanais + 12 mensais em ./backups
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 30
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 12
      HEALTHCHECK_PORT: 8080
    volumes: ["./backups:/backups"]
    depends_on:
      db: { condition: service_healthy }

  # Gera os PDFs dos contratos (via Chromium)
  pdf:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  # Caixa de e-mail de teste: tudo o que o CRM "envia" aparece em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["8025:8025"]

volumes:
  dados:
