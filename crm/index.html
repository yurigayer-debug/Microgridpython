  fr.onload=()=>{let d;try{d=JSON.parse(String(fr.result))}catch(e){return toast('Arquivo inválido: não é um JSON')}
    if(!d||!d.cfg||!COLS.every(c=>Array.isArray(d[c])))return toast('Este arquivo não é um backup do CRM Delta Solar');
    openModal(`<h2>Importar backup?</h2><p>Os dados atuais deste navegador serão substituídos por ${COLS.reduce((a,c)=>a+d[c].length,0)} registro(s) do arquivo <b>${esc(f.name)}</b>.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" id="btImp">Substituir dados</button></div>`);
    document.getElementById('btImp').onclick=()=>{S=d;migrar();save();closeModal();route();toast('Backup importado')};
  };
  fr.readAsText(f);input.value='';
}

const MANUAL_MD=`# Manual de utilização

Sistema de gestão da Delta Solar: funil de vendas, propostas, obras, agenda, app do técnico, monitoramento, contratos de O&M e financeiro. Este manual está dentro do próprio sistema, no menu **Manual**.

## Como o sistema roda

O mesmo arquivo funciona de dois jeitos, e ele percebe sozinho onde está:

- **No navegador (protótipo)**: os dados ficam salvos só naquele computador, naquele navegador. Serve para treinar a equipe e testar ideias sem risco. O rodapé do menu mostra *"Dados salvos neste navegador"*.
- **No Google (uso real)**: a página é servida pelo Apps Script e os dados ficam numa **Planilha Google** da empresa, com fotos e assinaturas no **Drive** e backup diário automático. O rodapé mostra *"Dados na Planilha Google"* e a versão.

No modo Google, cada pessoa entra com a própria conta e só quem está na aba **Usuarios** da planilha consegue abrir o sistema.

> Guarde o link interno (o da equipe) e o link público (o das propostas) em lugares separados. O público serve só para abrir propostas pelo link, nada mais.

## Primeiros passos (quem administra)

1. Instale o sistema no Apps Script seguindo o arquivo **LEIAME.md**: rode a função **instalar**, autorize e publique as duas implantações.
2. Abra **Configurações** e cole a *URL pública das propostas* (a da segunda implantação). Sem ela, o link que o cliente recebe não é gerado.
3. Cadastre as pessoas da equipe pela função **adicionarUsuario** (papel *editor* para quem vende e opera, *leitor* para quem só acompanha).
4. Cadastre os **kits solares** com os custos reais do seu distribuidor. Tudo o que a proposta calcula de preço sai daí.

Ainda em Configurações, confira antes de atender o primeiro cliente:

- **Tarifa e Fio B** da CEEE Equatorial (valor vigente, com impostos).
- **HSP mensal** de Pelotas ou da cidade onde você mais trabalha.
- **CDI e poupança**, usados na comparação com aplicações financeiras.
- **IOF, juros do cartão e desconto no PIX**.
- **Margem mínima** e a **senha do gestor**, que libera propostas abaixo dessa margem.
- **Marcas, garantias, documentos e responsável técnico**, que aparecem na página do cliente.

## O caminho de uma venda

O sistema acompanha o cliente do primeiro contato até a manutenção:

1. **Funil de vendas**: o negócio nasce como *lead* e vai andando pelas etapas, arrastando o cartão.
2. **Proposta**: criada a partir do negócio, já com os dados do cliente.
3. **Página do cliente**: o cliente abre o link, compara as opções, escolhe a forma de pagamento e aceita.
4. **Obra**: o aceite cria sozinho o cliente, a usina, os títulos a receber e a visita técnica.
5. **Agenda e app do técnico**: a equipe executa as etapas com checklist, fotos e assinatura.
6. **Monitoramento e O&M**: depois de conectada, a usina entra no acompanhamento de geração e nos contratos de manutenção.

## Funil de vendas

Cada coluna é uma etapa. Arraste o cartão para mover o negócio; as duas áreas no rodapé marcam **Ganho** ou **Perdido**.

- O cartão mostra valor, potência, responsável e há quantos dias está parado na etapa.
- O filtro por origem ajuda a ver de onde vêm os melhores negócios.
- **Parados** mostra só o que está há muito tempo sem andar.
- Clicando no cartão você edita o negócio ou abre a proposta ligada a ele.

## Como montar uma proposta

A proposta tem dez abas. O resumo da direita acompanha tudo em tempo real: preço, geração, economia, payback, custo, lucro e margem.

### 1 · Cliente e consumo

Escolha o negócio e o cliente (ou deixe para criar no aceite). Informe a ligação (mono, bi ou trifásica — define o custo de disponibilidade de 30, 50 ou 100 kWh) e o consumo, de duas formas:

- **Média mensal**: mais rápido, bom para uma primeira conversa.
- **Mês a mês**: mais fiel, principalmente em casa de praia, irrigação e comércio com sazonalidade. Peça as doze contas ou o histórico do app da distribuidora.

### 2 · Dimensionamento

- **Autoconsumo (simultaneidade)**: quanto da geração o cliente usa na hora em que ela acontece. Essa parte não passa pela rede e **não paga Fio B**, por isso muda a economia. Os padrões por perfil (residencial 25%, comercial diurno 60%, rural 40%) ficam em Configurações; ajuste conforme a rotina real do cliente.
- **Perdas**: temperatura, sujeira, sombreamento, cabos, inversor e descasamento. O sistema mostra a eficiência global (PR) que saiu dessas perdas, normalmente entre 75% e 82%.
- **Orientação**: desvio do Norte (0° = virado para o Norte, 90° = Leste ou Oeste, 180° = Sul) e inclinação do telhado. O fator de correção aparece ao lado.
- **Cobertura, módulo e número de módulos**: deixe o número de módulos vazio para o sistema dimensionar sozinho; preencha quando o telhado ou o orçamento mandarem.
- **Kit**: ao escolher um kit do catálogo, os itens e os custos da aba 3 são montados automaticamente.

Nessa aba aparece também o alerta de **CC/CA**: se a potência dos módulos passar muito da potência do inversor, troque o kit ou reduza os módulos.

### 3 · Itens e custos

A lista do que vai na obra. O cliente vê só a descrição e a quantidade; os custos são internos. Use **+ Item** para incluir o que o kit não cobre (padrão de entrada, estrutura especial, guindaste) e ajuste projeto e frete.

### 4 · Preço e margem

Duas formas de trabalhar:

- **Pela margem**: você diz a margem desejada e o sistema calcula o preço, já descontando comissão e impostos.
- **Pelo preço**: você digita o preço e vê a margem que sobrou.

Se a margem final ficar abaixo da mínima, o sistema avisa e só deixa emitir com a senha do gestor.

### 5 · Retorno

Premissas do retorno do investimento: reajuste da tarifa, degradação (o primeiro ano é maior que os demais), O&M anual, inflação do O&M, troca do inversor e taxa de desconto do VPL.

O resultado mostra economia do primeiro ano, conta antes e depois, payback, ganho líquido em 25 anos, **TIR**, **VPL**, cenários de reajuste (conservador, base e realista) e a comparação com CDI e poupança.

> Fale sempre de **ganho líquido**: já estão descontados o O&M e a troca do inversor. É o número que se sustenta numa conversa com um cliente que pesquisa.

### 6 · Financiamento

Simula as financeiras cadastradas, com o IOF embutido conforme a linha (pessoa física, empresa ou rural). A tabela **parcela × economia** mostra, ano a ano, quanto o cliente paga, quanto economiza e quanto sobra no bolso — a parcela é fixa, a economia cresce com a tarifa.

### 7 · Opções A/B/C

A opção A é a própria proposta (abas 1 a 5). Acrescente B e C para o cliente comparar na mesma página — por exemplo: com bateria, pronto para bateria e microinversores. Cada opção tem seu kit, preço e margem; consumo, tarifa e premissas são os mesmos para todas.

### 8 · Backup

Liste as cargas que o cliente quer manter ligadas na falta de energia. O sistema calcula a energia por dia, a potência de pico e quantas horas cada opção aguenta, já descontando o consumo próprio do inversor.

### 9 · Pagamento

Escolha as formas que o cliente vai ver: PIX à vista com desconto, cartão, parcelas da obra e financiamento. As parcelas da obra precisam somar 100%. É essa escolha que vira os títulos a receber no aceite.

### 10 · Emitir

Confira a validade e clique em **Emitir**. A partir daí o sistema congela uma "foto" da proposta: mesmo que você mexa nos números depois, o cliente continua vendo o que recebeu. Se alterar algo, um aviso aparece pedindo para reemitir.

Depois de emitida você tem o **link do cliente**, a **mensagem pronta de WhatsApp** e a opção **Ver como cliente**.

## A página do cliente

É o que o cliente abre pelo link, no celular ou no computador: as opções lado a lado, o sistema proposto, consumo × geração, o que muda na conta, os cenários de tarifa, a autonomia na falta de luz, o que está incluso, as formas de pagamento, garantias, cronograma, documentos e obras realizadas.

O cliente escolhe a opção, escolhe a forma de pagamento, digita o nome e aceita. O aceite fica registrado com data, hora e navegador.

Quando o cliente aceita, o sistema cria sozinho:

- o **cliente**, se ainda não existia;
- a **usina** na primeira etapa da obra;
- os **títulos a receber** conforme a forma escolhida;
- a **visita técnica** nos próximos dias;
- e marca o **negócio como ganho**.

> Proposta aceita ou recusada vira somente leitura. Para mudar qualquer coisa, use **Nova versão**: a anterior fica guardada no histórico.

## Contratos

A aba **Contratos** gera o contrato de prestação de serviços a partir da proposta aprovada (ou em branco), envia para assinatura e guarda tudo no histórico.

1. **+ Novo contrato**: escolha a proposta (as aceitas aparecem primeiro com ✓) ou *Em branco*, e o modelo (Solar, Elétrica, Termo Aditivo ou um seu).
2. **Contratante**: tipo (CPF/CNPJ), nome, documento e endereço. Digite o **CEP** e o endereço é preenchido sozinho.
3. **Obra e kit**: local da obra (ou o mesmo do contratante) e a **seção própria do kit** — módulos, inversor, bateria, telhado e estrutura. Use *Puxar da proposta* ou *Puxar do catálogo*.
4. **Preço e pagamento**: itens (Kit, Engenharia, Mão de obra, Materiais, Frete), total por extenso automático e parcelas, que precisam somar o total.
5. **Cláusulas**: edite o texto de qualquer cláusula, mude a ordem, acrescente ou remova. Toque num campo {{...}} para inseri-lo no texto.
6. **Revisar e enviar**: o sistema lista o que falta. *Gerar e enviar* congela o texto (com código SHA-256) e abre a mensagem de WhatsApp; também há e-mail, PDF, .docx e *Compartilhar PDF* (no celular abre o WhatsApp/e-mail com o arquivo anexado).

### Assinatura online

- **No Google**: o cliente recebe o link, lê o contrato no celular (resumo simples no topo, cláusulas abrem e fecham), confirma nome e CPF/CNPJ, marca a concordância e assina com o dedo. O sistema guarda data, hora, aparelho e o código de integridade, salva o PDF assinado no Drive (pasta Contratos) e manda a via por e-mail. Requer o arquivo **Contratos.gs** (ver LEIAME-contratos.md).
- **No navegador**: use **Assinatura presencial** — o cliente assina na tela do seu celular ou tablet.
- Depois, a empresa **contra-assina**; o contrato fica *Concluído* e as parcelas viram títulos a receber (se a proposta não tiver criado).

### Templates de contrato

Em **Templates de contrato** você edita os modelos (cláusulas e textos), cria novos (ex.: manutenção, elétrica comercial) e importa um **.docx** do Word com os campos {{...}}. Baixe o *Modelo .docx editável* para começar: linhas de tabela com {{item_...}} ou {{parcela_...}} se repetem para cada item.

> O texto-base é o contrato padrão da Delta Solar. Revise com o seu jurídico antes do uso — principalmente multas, honorários e foro, em Configurações → Contratos.

## Usinas e obras

Cada usina passa por cinco etapas: visita técnica, projeto e homologação, instalação, conexão e vistoria, concluída. O semáforo compara os dias na etapa com o prazo configurado: verde no prazo, amarelo em atenção, vermelho atrasado.

Use **Avançar** quando a etapa terminar. Ao chegar na conexão, informe a plataforma e o código da planta para o monitoramento.

## Agenda e app do técnico

A agenda mostra as visitas abertas e as já executadas. Em **App do técnico** a tela fica no formato de celular: o técnico escolhe o nome, abre a ordem de serviço do dia, marca o checklist, anexa fotos, colhe a assinatura do cliente e conclui.

No modo Google, as fotos e a assinatura sobem para a pasta do Drive e ficam ligadas à ordem de serviço.

## Monitoramento

Compara a geração de cada usina conectada com a esperada. Abaixo do limite configurado, a usina aparece em alerta e você abre uma ordem de serviço em dois cliques.

> No protótipo os dados de geração são simulados. A leitura real virá da API da plataforma do inversor.

## Contratos de O&M

Contratos recorrentes de manutenção (limpeza, inspeção termográfica, revisão). Cada contrato tem periodicidade, valor e técnico. **Gerar visitas pendentes** cria as visitas e os títulos a receber dos contratos que estão vencendo.

## Financeiro

Contas a receber e a pagar, com baixa manual ou por PIX. A cobrança PIX gera um código e, quando o pagamento chega, o título é baixado sozinho — sem duplicar, mesmo que o aviso venha duas vezes.

> No protótipo a cobrança PIX é simulada. Na versão com banco, entra a integração do provedor de pagamento.

## No celular

O sistema foi ajustado para telas pequenas:

- As listas (propostas, clientes, kits, obras, agenda, financeiro) aparecem como **cartões**, um embaixo do outro.
- O botão laranja de cada tela (**+ Novo negócio**, **+ Nova proposta**, **+ Lançamento**…) fica **flutuando no canto de baixo**.
- No **Funil**, toque na etapa no topo para ver os negócios dela. Toque no cartão para abrir; use **Mover…** para trocar de etapa ou marcar ganho/perdido.
- Na **Proposta**, a barra de baixo mostra o passo atual, o preço e o payback. Use ◀ ▶ para andar entre as etapas.
- O tema claro/escuro fica no fim do menu lateral (☰).

## Meu WhatsApp

Em **Configurações → Meu WhatsApp**, cada pessoa cadastra o próprio WhatsApp e, se quiser, uma assinatura. A mensagem pronta da proposta sai assinada por quem está usando, e o botão **Abrir no WhatsApp** já leva a mensagem para o telefone do cliente.

## Backup no modo navegador

Quando o sistema roda fora do Google (Docker, servidor ou arquivo aberto no computador), os dados ficam no próprio navegador. Em **Configurações → Dados**:

- **Baixar backup (.json)** salva tudo num arquivo.
- **Importar backup** traz os dados de volta (substitui os atuais).

Se o navegador não conseguir salvar, aparece uma **barra vermelha** no rodapé com o botão para exportar na hora.

## Tema claro e escuro

O botão no canto do cabeçalho alterna entre o tema claro e o escuro. Na primeira vez o sistema segue a preferência do seu computador; depois ele lembra a sua escolha naquele navegador. A página do cliente tem o mesmo botão, flutuando no canto.

## Segurança dos dados

No modo Google:

- Nada é apagado de verdade: excluir marca o registro como excluído e ele continua na planilha.
- Toda alteração relevante entra na aba **Log**, com quem fez e quando.
- O **backup diário** roda de madrugada e guarda 30 cópias diárias e 12 mensais na pasta Backups. Em Configurações há o botão **Fazer backup agora**.
- O aceite do cliente é protegido: uma tela aberta há muito tempo não desfaz o que o cliente acabou de aceitar.

## Antes de usar com clientes de verdade

Confira os pontos marcados como **TODO-VERIFICAR** dentro do sistema:

- tarifa e Fio B vigentes da distribuidora;
- HSP da cidade, de preferência conferida na NASA POWER ou no PVGIS;
- a regra do Fio B depois de 2028;
- o fator de orientação e inclinação, comparado com PVGIS ou PVsyst;
- CDI, poupança, IOF e a taxa real da maquininha;
- marcas, prazos de garantia e dados do responsável técnico.

Os números do sistema são estimativas de engenharia para apoiar a venda. A proposta assinada e o projeto elétrico continuam sendo responsabilidade do responsável técnico.

## Problemas comuns

- **A página abre em branco ou com um aviso vermelho**: o arquivo colado no Apps Script está incompleto ou a implantação é antiga. Cole o Index inteiro (da primeira à última linha) e publique em *Implantar → Gerenciar implantações → ✏ → Nova versão*.
- **O link do cliente não aparece**: falta a URL pública em Configurações.
- **"Você não está autorizado"**: a conta não está na aba Usuarios da planilha.
- **Alterei a proposta e o cliente vê outro valor**: é a foto congelada da emissão. Clique em **Reemitir**.
- **A economia parece alta demais**: confira a tarifa, o autoconsumo e as perdas. Autoconsumo exagerado é o erro mais comum.
- **Não consigo emitir**: veja a mensagem no rodapé — falta um campo, as parcelas da obra não somam 100% ou a margem está abaixo da mínima.

function mdHtml(md){
  const esc_=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const il=s=>esc_(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
  const out=[];let lista=null;
  const fecha=()=>{if(lista){out.push('</'+lista+'>');lista=null}};
  md.split('\n').forEach(l=>{
    l=l.replace(/\s+$/,'');
    if(!l.trim()){fecha();return}
    let m;
    if(m=l.match(/^###\s+(.*)/)){fecha();out.push('<h4 class="mh4">'+il(m[1])+'</h4>');return}
    if(m=l.match(/^>\s+(.*)/)){fecha();out.push('<div class="hint" style="margin:10px 0">'+il(m[1])+'</div>');return}
    if(m=l.match(/^-\s+(.*)/)){if(lista!=='ul'){fecha();out.push('<ul class="mlist">');lista='ul'}out.push('<li>'+il(m[1])+'</li>');return}
    if(m=l.match(/^\d+\.\s+(.*)/)){if(lista!=='ol'){fecha();out.push('<ol class="mlist">');lista='ol'}out.push('<li>'+il(m[1])+'</li>');return}
    if(lista){out.push('<li>'+il(l.replace(/^\s+/,''))+'</li>');return}
    out.push('<p>'+il(l)+'</p>');
  });
  fecha();
  return out.join('\n');
}

function instalarPwa(){
  if(GAS||!/^https?:$/.test(location.protocol))return;
  const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)};
  add('manifest','manifest.webmanifest');add('apple-touch-icon','icons/apple-touch-icon.png');
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
