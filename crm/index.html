<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2621">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delta CRM">
<title>Delta CRM & Contratos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --bg:#f3f5f1;--card:#ffffff;--ink:#13221e;--mute:#5d6b66;--line:#e1e6e0;--line2:#eef1ec;
  --hover:#fafbf8;--soft:#f6f8f4;--col:#e9ede7;--chip:#eef1ec;--field:#ffffff;--edge:#b9c7c0;--sel:#f2faf5;
  --hintbg:#fff8e6;--hintln:#f5dfa6;--hintink:#6d5000;--errbg:#fdecea;--errln:#f3c3bd;--errink:#8c2a23;
  --pg:#dff4ea;--pgi:#11734c;--pr:#fbe3e0;--pri:#a5302a;--pa:#fdf0cf;--pai:#8a6200;--pb:#e2ecfc;--pbi:#1f56b0;--ps:#fff1d6;--psi:#8a5a00;
  --side:#0e2621;--side2:#163a32;--sun:#f4a41e;--sun2:#ffd27a;--green:#1c9a68;--red:#d34a3f;--amber:#d99a00;--blue:#2a6fdb;
  --r:12px;
}
html[data-tema="escuro"]{
  color-scheme:dark;
  --bg:#0f1715;--card:#17211f;--ink:#e7efeb;--mute:#93a7a0;--line:#27332f;--line2:#1f2a27;
  --hover:#1c2825;--soft:#141d1b;--col:#131b19;--chip:#223029;--field:#101917;--edge:#3b4a45;--sel:#142b22;
  --hintbg:#2a2415;--hintln:#4c4121;--hintink:#ecd79e;--errbg:#2d1a18;--errln:#5c302b;--errink:#f4b7ae;
  --pg:#123a2a;--pgi:#73e4b4;--pr:#3d1f1c;--pri:#f3aba1;--pa:#3a2f12;--pai:#f2d79a;--pb:#16294a;--pbi:#a2c3f6;--ps:#39290f;--psi:#f2c87c;
  --side:#0b1614;--side2:#17241f;--green:#2fb77f;--red:#e8675b;--amber:#e8b020;
}
html[data-tema="escuro"] .btn.pri{background:var(--green);border-color:var(--green);color:#06130e}
html[data-tema="escuro"] .logo{color:#1b130a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}
#app{display:flex;min-height:100vh}
aside#side{width:232px;flex:0 0 232px;background:var(--side);color:#d7e4df;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--sun),#ff7a1a);display:grid;place-items:center;color:#1b130a;font-weight:800;font-size:20px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand small{color:#8fb0a6;font-size:11px}
.navsec{padding:10px 18px 4px;color:#6f9387;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
aside a.nav{display:flex;align-items:center;gap:10px;padding:8px 18px;color:#cfe0da;text-decoration:none;border-left:3px solid transparent}
aside a.nav:hover{background:var(--side2)}
aside a.nav.on{background:var(--side2);border-left-color:var(--sun);color:#fff;font-weight:700}
aside a.nav .ic{width:18px;text-align:center}
.sidefoot{margin-top:auto;padding:14px 18px;font-size:11px;color:#7f9f95;border-top:1px solid #1d443b}
main{flex:1;min-width:0}
header#top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 26px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}
header .sub{color:var(--mute);font-size:12.5px}
#view{padding:22px 26px 60px;max-width:1400px}
.burger{display:none;background:none;border:0;font-size:22px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:default}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--edge)}
.kpi .l{color:var(--mute);font-size:12px;font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.kpi .s{color:var(--mute);font-size:11.5px;margin-top:2px}
.kpi.warn .v{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 10px;font-size:14.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--edge)}
.btn.pri{background:var(--side);color:#fff;border-color:var(--side)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1b130a}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:hover td{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--chip);color:var(--mute);white-space:nowrap}
.pill.g{background:var(--pg);color:var(--pgi)}.pill.r{background:var(--pr);color:var(--pri)}.pill.a{background:var(--pa);color:var(--pai)}.pill.b{background:var(--pb);color:var(--pbi)}.pill.s{background:var(--ps);color:var(--psi)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}.dot.n{background:#b8c2bd}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:600}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);background:var(--field);font-weight:500;width:100%}
label.f input:focus,select:focus,textarea:focus{outline:2px solid var(--sun2);border-color:var(--sun)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.fg .w2{grid-column:span 2}
.muted{color:var(--mute)}
.small{font-size:12px}
.hint{background:var(--hintbg);border:1px solid var(--hintln);color:var(--hintink);border-radius:10px;padding:9px 12px;font-size:12.5px}
.err{background:var(--errbg);border:1px solid var(--errln);color:var(--errink);border-radius:10px;padding:9px 12px;font-size:12.5px}
.empty{color:var(--mute);text-align:center;padding:26px}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
/* manual */
.manual .card{margin-bottom:12px}
.manual p{margin:8px 0;line-height:1.55;max-width:70ch}
.manual h3{font-size:15.5px;margin-bottom:6px}
.manlink{color:var(--ink);text-decoration:none;font-size:12.5px}
.manlink:hover{color:var(--green);text-decoration:underline}
.manual .mh4{margin:14px 0 4px;font-size:13.5px;color:var(--ink)}
.manual .mlist{margin:6px 0 6px 18px;padding:0}
.manual .mlist li{margin:4px 0;line-height:1.5;max-width:68ch}
@media print{
  aside#side,header#top,.sum,#toast,.no-print,.temabt,.pub-actions,.pub-accept-form{display:none!important}
  body{background:#fff!important;color:#111!important;font-size:12.5px}
  #view{padding:0!important;max-width:none!important}
  .pub{max-width:none!important}
  .split{display:block}
  .card,.pub-card,.hl div{border:1px solid #d7dfda!important;box-shadow:none!important;break-inside:avoid}
  .pubhead,.pub-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .only-print{display:block!important}
}
.only-print{display:none}
.img-carregando{background:linear-gradient(90deg,var(--soft),var(--line2),var(--soft));background-size:200% 100%;animation:imgcarr 1.2s linear infinite;min-height:120px}
@keyframes imgcarr{to{background-position:-200% 0}}
#avisoSalvar{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--errbg);color:var(--errink);border-top:2px solid var(--red);padding:12px 16px calc(12px + env(safe-area-inset-bottom));font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--col);border-radius:var(--r);padding:10px;min-height:300px}
.col.over{outline:2px dashed var(--sun)}
.colh{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:2px}
.colsub{font-size:11.5px;color:var(--mute);margin-bottom:8px}
.deal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
.deal b{display:block}
.deal .meta{font-size:12px;color:var(--mute);margin-top:3px}
.endzones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.zone{border:2px dashed var(--edge);border-radius:var(--r);padding:14px;text-align:center;font-weight:700;color:var(--mute)}
.zone.win{border-color:var(--green);color:var(--pgi)}.zone.lose{border-color:var(--red);color:var(--pri)}
.zone.over{background:var(--card)}
/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:9px 13px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--mute);border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--sun)}
.split{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.sum{position:sticky;top:80px}
.sum .ln{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.sum .ln b{font-variant-numeric:tabular-nums}
.big{font-size:24px;font-weight:800}
.resbox{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.resgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.resgrid div small{display:block;color:var(--mute);font-size:11.5px;font-weight:600}
.resgrid div b{font-size:16px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,24,20,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow:auto}
#modal.hidden{display:none}
#modal .box{background:var(--card);border-radius:14px;max-width:640px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal h2{margin:0 0 14px;font-size:17px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;font-weight:600}
#toast.on{opacity:1}
/* proposal public & templates */
.pub{max-width:920px;margin:0 auto;padding-bottom:36px}
.pub-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pubhead{background:linear-gradient(125deg,#0c231e 0%,#153d34 60%,#1c4f43 100%);color:#fff;border-radius:18px;padding:28px 30px;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(12,35,30,.14)}
.pubhead:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--sun2),var(--sun) 45%,transparent 70%);opacity:.35;pointer-events:none}
.pubhead h2{margin:8px 0 6px;font-size:27px;line-height:1.18;letter-spacing:-.3px}
.pubhead .pub-sub{color:rgba(255,255,255,.84);font-size:14px;max-width:64ch;line-height:1.5}
.pubhead .pub-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);font-size:12.5px;color:rgba(255,255,255,.86)}
.pub-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.3px;background:rgba(244,164,30,.2);color:#ffd27a;border:1px solid rgba(244,164,30,.35)}
/* Template 2: Consultivo (editorial técnico limpo) */
.pub.tpl-consultivo .pubhead{background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:6px solid var(--side);box-shadow:0 4px 18px rgba(0,0,0,.04)}
.pub.tpl-consultivo .pubhead:after{display:none}
.pub.tpl-consultivo .pubhead .pub-sub{color:var(--mute)}
.pub.tpl-consultivo .pubhead .pub-meta{border-top-color:var(--line);color:var(--mute)}
.pub.tpl-consultivo .pub-tag{background:var(--pb);color:var(--pbi);border-color:transparent}
.pub.tpl-consultivo .sec-num{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--green);background:var(--pg);padding:2px 7px;border-radius:6px;margin-right:8px;vertical-align:middle}
/* Template 3: Decisão Rápida (alto impacto e leitura rápida) */
.pub.tpl-direto .pubhead{background:linear-gradient(135deg,#12352c 0%,#0e2621 100%);border-radius:20px;padding:24px 26px}
.pub.tpl-direto .pub-tag{background:var(--sun);color:#1b130a;border-color:transparent}
.pub.tpl-direto .hl div{border-width:1.5px;background:var(--card)}
.pub.tpl-direto .hl div.destaque{border-color:var(--green);background:var(--sel)}
/* Decision blocks */
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin:16px 0}
.hl div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.hl small{color:var(--mute);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.hl b{display:block;font-size:22px;margin-top:4px;letter-spacing:-.3px}
.pub-intro{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:12px;padding:15px 18px;margin-top:14px;line-height:1.6}
.pub-pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:10px;margin-top:12px}
.pub-pillar{background:var(--soft);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45}
.pub-pillar b{display:block;margin-bottom:3px;color:var(--ink)}
.bill-cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.bill-box{text-align:center;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line2)}
.bill-box.after{border-color:var(--green);background:var(--sel)}
.bill-box small{display:block;color:var(--mute);font-size:11.5px;font-weight:700;text-transform:uppercase}
.bill-box b{display:block;font-size:24px;margin-top:4px}
.bill-arrow{font-size:22px;font-weight:800;color:var(--green);text-align:center}
.opt-card{cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:15px;transition:.15s;position:relative;background:var(--card)}
.opt-card:hover{border-color:var(--edge)}
.opt-card.on{border-color:var(--green);background:var(--sel);box-shadow:0 6px 20px rgba(28,154,104,.1)}
.opt-badge{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--green);color:#fff}
.pay-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;background:var(--soft)}
.pay-opt:hover{border-color:var(--edge)}
.pay-opt input{margin-top:3px}
.pub-foot{margin-top:18px;padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.sig-print{margin-top:24px;padding-top:18px;border-top:1px dashed var(--edge);display:grid;grid-template-columns:1fr 1fr;gap:36px}
.sig-line{border-top:1px solid #333;padding-top:6px;margin-top:40px;font-size:12px;text-align:center}
/* Template picker cards */
.tpl-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:6px}
.choice-card{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card);transition:.15s}
.choice-card:hover{border-color:var(--edge)}
.choice-card.on{border-color:var(--sun);background:var(--hintbg)}
.choice-card b{display:block;font-size:13.5px}
.choice-card small{display:block;color:var(--mute);font-size:11.5px;margin-top:3px;line-height:1.35}
/* Brand Logo & Proposal Gallery */
.brand-logo-box{background:#fff;border-radius:10px;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.brand-logo-box img{height:36px;width:auto;display:block;object-fit:contain}
.pub-logo-badge{background:#fff;border-radius:12px;padding:7px 13px;display:inline-flex;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.pub-logo-badge img{height:44px;width:auto;display:block;object-fit:contain}
.pub-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.pub-img-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);break-inside:avoid}
.pub-img-card img{width:100%;height:190px;object-fit:cover;display:block;background:#fff}
.pub-img-card .cap{padding:8px 11px;font-size:12.5px;color:var(--mute);font-weight:600}
.img-slot{border:1.5px dashed var(--edge);border-radius:12px;padding:10px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.img-slot img{width:100%;height:110px;object-fit:cover;border-radius:8px;background:#fff}
/* Template 4: Persuasão Consultiva (Método Dale Carnegie) */
.pub.tpl-carnegie .pubhead{background:linear-gradient(125deg,#0d2b45 0%,#123d3a 55%,#0e2621 100%);border-radius:18px;padding:30px 32px;box-shadow:0 14px 36px rgba(13,43,69,.2)}
.pub.tpl-carnegie .pub-tag{background:var(--sun);color:#1b130a;border-color:transparent;font-weight:800}
.dc-inaction{background:linear-gradient(135deg,var(--errbg),var(--hintbg));border:1.5px solid var(--hintln);border-left:5px solid var(--red);border-radius:14px;padding:18px 20px;margin-top:14px}
.dc-inaction h3{margin:0 0 6px;color:var(--errink);font-size:15.5px}
.dc-inaction-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
.dc-inaction-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.dc-inaction-box small{display:block;color:var(--mute);font-size:11.5px;font-weight:700;text-transform:uppercase}
.dc-inaction-box b{display:block;font-size:21px;margin-top:3px;color:var(--red)}
.dc-proof{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.dc-quote{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;line-height:1.5;position:relative}
.dc-quote b{display:block;margin-top:8px;color:var(--ink);font-size:12.5px}
.dc-faq{display:grid;gap:8px;margin-top:10px}
.dc-faq-item{background:var(--soft);border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.dc-faq-item b{display:block;color:var(--ink);margin-bottom:4px;font-size:13.5px}
.dc-faq-item p{margin:0;font-size:13px;color:var(--mute);line-height:1.5}
.dc-guarantee{background:var(--sel);border:1.5px solid var(--green);border-radius:14px;padding:16px 18px;margin-top:14px;display:flex;gap:14px;align-items:flex-start}
.dc-guarantee .ic-shield{font-size:28px;line-height:1;flex:0 0 auto}

function _ext3(n){
  const U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  if(n===100)return 'cem';const c=Math.floor(n/100),r=n%100,p=[];
  if(c)p.push(C[c]);if(r)p.push(r<20?U[r]:D[Math.floor(r/10)]+(r%10?' e '+U[r%10]:''));
  return p.join(' e ')||'zero';
}
function extensoInt(n){
  n=Math.floor(Math.abs(num(n)));if(!n)return 'zero';
  const b=Math.floor(n/1e9),m=Math.floor(n/1e6)%1000,k=Math.floor(n/1000)%1000,u=n%1000,p=[];
  if(b)p.push(b===1?'um bilhão':_ext3(b)+' bilhões');
  if(m)p.push(m===1?'um milhão':_ext3(m)+' milhões');
  if(k)p.push(k===1?'mil':_ext3(k)+' mil');
  if(u)p.push(_ext3(u));
  if(p.length<2)return p[0];
  const ult=p.pop();return p.join(', ')+((u&&(u<=100||u%100===0))?' e ':' ')+ult;
}
function extensoReais(v){
  v=Math.round(Math.abs(num(v))*100)/100;const r=Math.floor(v),c=Math.round((v-r)*100);

  if(c)s+=(s?' e ':'')+extensoInt(c)+(c===1?' centavo':' centavos');
  return (s||'zero real').toUpperCase();
}

async function ctPdfBlob(snap,assin){

async function ctBuscarCep(id,base,cep){
  const d=soDig(cep);if(d.length!==8)return toast('CEP deve ter 8 dígitos');
  const c=ctDe(id);if(!c)return;
  try{
    const r=await fetch(`https://viacep.com.br/ws/${d}/json/`);const j=await r.json();
    if(j.erro)return toast('CEP não encontrado — preencha o endereço manualmente');
    const e=ctGet(c,base);Object.assign(e,{cep:fmtCep(d),logradouro:j.logradouro||e.logradouro,bairro:j.bairro||e.bairro,cidade:j.localidade||e.cidade,uf:j.uf||e.uf});
    save();viewContrato(id);toast('Endereço preenchido pelo CEP');
    setTimeout(()=>{const n=document.querySelector(`[data-f="${base}.numero"]`);if(n)n.focus()},50);
  }catch(e){toast('Sem acesso à busca de CEP agora. Preencha manualmente.')}
}

function ctValidar(c){
  const e=[],w=[];const pt=c.parte;

  if(!pt.logradouro)e.push('Endereço do contratante');if(!soDig(pt.cep))w.push('CEP do contratante não informado');
  if(c.obra.mesmo===false&&!c.obra.logradouro)e.push('Endereço da obra');
  if(c.tipo==='solar'&&(!num(c.kit.modQtd)||!num(c.kit.modWp)||!c.kit.invDesc))e.push('Kit solar (módulos e inversor)');
  if(c.tipo==='eletrica'&&!String(c.elEscopo||'').trim())e.push('Escopo do serviço elétrico');
  if(c.tipo==='aditivo'&&!String(c.aditivoDesc||'').trim())e.push('Objeto do aditivo');
  const tot=ctTotal(c);if(!tot)e.push('Itens com valor');
  const sp=(c.parcelas||[]).reduce((a,p)=>a+num(p.valor),0);if(!(c.parcelas||[]).length)e.push('Parcelas');else if(Math.abs(sp-tot)>0.009)e.push('Parcelas somando o total');
  const f=ctFaltando(c).filter(k=>!['testemunha1_nome','testemunha1_doc','testemunha2_nome','testemunha2_doc','assinatura_data','assinatura_hash','uc','cliente_rg','cliente_complemento','cliente_representante','kit_bat_desc','contrato_original','aditivo_descricao'].includes(k));
  if(f.length)w.push('Campos vazios no texto: '+f.join(', '));
  if(!pt.email&&!pt.fone)w.push('Sem e-mail e sem WhatsApp do contratante para o envio');
  return {e,w};
}

  const assunto=`Contrato ${c.codigo} — ${S.cfg.empresa}`;
  const corpo=ctMsg(c).replace(/^Olá/,'Olá')+(link?'':'\n\n(O PDF do contrato segue em anexo.)');
  openModal(`<h2>Enviar por e-mail</h2><div class="fg"><label class="f w2">Para<input id="em_para" type="email" value="${esc(c.parte.email||'')}"></label><label class="f w2">Assunto<input id="em_ass" value="${esc(assunto)}"></label><label class="f w2">Mensagem<textarea id="em_corpo" rows="8">${esc(corpo)}</textarea></label></div>
    <div class="small muted" style="margin-top:6px">${GAS?'“Enviar pelo Gmail” envia pela conta Google do sistema, com o PDF do contrato em anexo.':'No modo navegador o e-mail abre no seu aplicativo; anexe o PDF (botão Compartilhar PDF faz isso direto no celular).'}</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn" onclick="ctCompartilhar('${c.id}')">📲 Compartilhar PDF</button><button class="btn" onclick="ctMailto('${c.id}')">Abrir no app de e-mail</button>${GAS?`<button class="btn ok" onclick="ctEmailGas('${c.id}')">✉ Enviar pelo Gmail</button>`:''}</div>`);
}
function ctMailto(id){const g=k=>document.getElementById(k).value;location.href=`mailto:${encodeURIComponent(g('em_para'))}?subject=${encodeURIComponent(g('em_ass'))}&body=${encodeURIComponent(g('em_corpo'))}`;ctLogEnvio(id,'e-mail (app)')}
async function ctEmailGas(id){
  const c=ctDe(id);const g=k=>document.getElementById(k).value;if(!g('em_para'))return toast('Informe o e-mail');
  if(!c.snap)return toast('Gere o contrato (Enviar para assinatura) antes do e-mail');
  try{toast('Enviando e-mail…');await gas('enviarContratoEmail',{id:c.id,para:g('em_para'),assunto:g('em_ass'),corpo:g('em_corpo')});closeModal();ctLogEnvio(id,'e-mail (Gmail) para '+g('em_para'));toast('E-mail enviado com o PDF')}
  catch(e){toast('Falha no envio: '+(e&&e.message||e))}
}

  <label class="f" style="margin-top:10px">Nome de quem assina pela ${esc(ctCfg().razao)}<input id="ce_nome" value="${esc(meuPerfil().nome||'')}"></label>

async function ctConfirmaEmpresa(id){
  const c=ctDe(id);const nome=document.getElementById('ce_nome').value.trim();if(nome.length<3)return toast('Informe o nome');if(!sigDirty)return toast('Desenhe a assinatura');
  c.assin.empresa={nome,quando:new Date().toLocaleString('pt-BR'),data:todayISO(),img:document.getElementById('sig').toDataURL('image/png')};
  c.status='concluido';logCt(c,'Contra-assinado pela empresa: '+nome);ctPosAssinatura(c);
  if(GAS){try{await gas('contraAssinarContrato',{id:c.id,empresa:c.assin.empresa,html:ctDocHtml(c.snap,c.assin)})}catch(e){toast('Assinado aqui; falha ao atualizar o Drive: '+(e&&e.message||e))}}
  save();closeModal();viewContrato(id);toast('Contrato concluído ✓');

/* Ao concluir: lança os títulos a receber das parcelas (se a proposta ainda não lançou) */
function ctPosAssinatura(c){
  if(c.titulosCriados)return;const p=c.propostaId&&S.propostas.find(x=>x.id===c.propostaId);
  if(p&&p.status==='aceita'){c.titulosCriados=true;return}
  (c.parcelas||[]).forEach(x=>S.titulos.push({id:uid(),tipo:'receber',desc:`${x.desc} — ${c.parte.nome} (${c.codigo})`,pessoa:c.parte.nome,valor:num(x.valor),venc:x.data||todayISO(),pago:false,contratoVendaId:c.id}));
  c.titulosCriados=true;logCt(c,`${(c.parcelas||[]).length} título(s) a receber lançados no Financeiro`);
}

  return `<div class="ctp-prog"><i id="ctpProg"></i></div><div class="ctp">

      <div class="ctp-sum"><div><span>Valor total</span><b>${brl(s.valor)}</b></div>${s.prazo?`<div><span>Prazo</span><b>${esc(s.prazo)}</b></div>`:''}${s.garantia?`<div><span>Garantia adicional</span><b>${esc(s.garantia)}</b></div>`:''}<div><span>Parcelas</span><b>${(s.parcelas||[]).length}× · 1ª em ${fdata(((s.parcelas||[])[0]||{}).data)}</b></div></div></div>
    <div class="ctp-card"><h3>Resumo em linguagem simples</h3>
      <p class="small" style="margin:0 0 8px;line-height:1.6">Antes do texto jurídico, os pontos principais. O contrato completo está logo abaixo — toque em cada cláusula para abrir ou fechar.</p>

      <b class="small">Como você paga</b><table style="margin-top:4px">${(s.parcelas||[]).map(p=>`<tr><td>${fdata(p.data)}</td><td>${esc(p.desc)}</td><td class="num"><b>${brl(p.valor)}</b></td></tr>`).join('')}</table>
      <div class="small muted" style="margin-top:6px">Valor por extenso: ${esc(s.extenso||'')}</div></div>

    <div class="ctp-doc">

      ${r.clausulas.map(cl=>`<details open id="ctp-cl${cl.n}"><summary><span><small>Cláusula ${cl.ord.toLowerCase()}</small>${esc(friendly(cl.titulo))}</span><span class="seta">›</span></summary><div class="corpo">${cl.linhas.map(l=>ctLinhaHtml(l,r)).join('')}</div></details>`).join('')}
      <details open><summary><span><small>Encerramento</small>Assinaturas</span><span class="seta">›</span></summary><div class="corpo">${r.fecho.map(l=>ctLinhaHtml(l,r)).join('')}</div></details>

    </div>

function ctpIr(n){const d=document.getElementById('ctp-cl'+n);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}}
function ctpProgresso(){const el=document.getElementById('ctpProg');if(!el)return;const h=document.documentElement.scrollHeight-innerHeight;el.style.width=(h>0?Math.min(100,scrollY/h*100):100)+'%'}
window.addEventListener('scroll',ctpProgresso,{passive:true});
function ctpRender(){V(ctPubHtml(CTPUB.snap,CTPUB.status,CTPUB.assin,CTPUB));setTimeout(()=>{if(document.getElementById('sig'))initSig();ctpProgresso()},30)}
async function ctpPdf(){try{toast('Gerando PDF…');const b=await ctPdfBlob(CTPUB.snap,CTPUB.assin);baixarBlob(b,ctNomeArq(CTPUB.snap,'pdf'))}catch(e){toast('Use Imprimir → Salvar como PDF');window.print()}}
async function ctpAssinar(){
  const nome=document.getElementById('cs_nome').value.trim(),doc=soDig(document.getElementById('cs_doc').value),email=document.getElementById('cs_email').value.trim();
  if(nome.split(/\s+/).length<2)return toast('Informe seu nome completo');
  const esperado=soDig(CTPUB.snap.render.partes.clienteDoc);
  if(!doc)return toast('Informe o '+(CTPUB.snap.render.partes.tipoDoc||'CPF')+' para confirmar');
  if(esperado&&doc!==esperado)return toast('O documento não confere com o do contrato');
  if(!validDoc(doc))return toast('Documento inválido');
  if(!document.getElementById('cs_ok').checked)return toast('Marque a concordância com o contrato');
  if(!sigDirty)return toast('Desenhe sua assinatura no quadro');
  const dados={nome,doc:fmtDoc(doc),tipoDoc:CTPUB.snap.render.partes.tipoDoc||'CPF',email,agente:navigator.userAgent.slice(0,120),img:document.getElementById('sig').toDataURL('image/png'),hash:CTPUB.snap.hash};
  const b=document.getElementById('cs_btn');b.disabled=true;b.textContent='Registrando assinatura…';
  try{
    if(CTPUB.local){const c=ctDe(CTPUB.id);ctAssinarLocal(c,dados);CTPUB.assin=c.assin;CTPUB.status=c.status}
    else{const d=await gas('assinarContratoPublico',CTPUB.id,CTPUB.t,dados);if(d&&d.erro)throw new Error(d.erro);CTPUB.assin=d.assin;CTPUB.status=d.status}
    ctpRender();window.scrollTo(0,document.body.scrollHeight);toast('Contrato assinado. Obrigado!');
  }catch(e){b.disabled=false;b.textContent='✍ Assinar contrato';toast('Não foi possível registrar: '+(e&&e.message||e))}
}
function ctAssinarLocal(c,d){
  const agora=new Date();c.assin=c.assin||{};
  c.assin.cliente=Object.assign({},d,{quando:agora.toLocaleString('pt-BR'),data:todayISO(),presencial:true});
  c.status='assinado_cliente';logCt(c,`Assinado pelo cliente (${d.nome}) — presencial neste aparelho`);save();
}

/* Modo Google: traz para o CRM as assinaturas feitas pelos clientes no link público */
async function ctSyncGas(){
  if(!GAS)return;try{
    const l=await gas('statusContratos');let mud=0;
    (l||[]).forEach(x=>{const c=ctDe(x.id);if(!c)return;
      if(x.visualizadoEm&&!c.visualizadoEm){c.visualizadoEm=x.visualizadoEm;if(c.status==='enviado')c.status='visualizado';logCt(c,'Aberto pelo cliente');mud++}
      if(x.assin&&x.assin.cliente&&!(c.assin&&c.assin.cliente)){c.assin=Object.assign({},c.assin,{cliente:x.assin.cliente});c.status='assinado_cliente';logCt(c,'Assinado online pelo cliente ('+x.assin.cliente.nome+')');mud++}
      if(x.pdfUrl&&c.pdfUrl!==x.pdfUrl){c.pdfUrl=x.pdfUrl;mud++}});
    if(mud){save();if(/^(contratos|ct-|painel)/.test(curHash()))route();toast(mud+' atualização(ões) de contratos recebida(s)')}
  }catch(e){/* Contratos.gs ainda não instalado: segue sem sincronizar */}
}

  <div class="card" id="tplbody">
    <div class="row between" style="margin-bottom:10px"><h3 style="margin:0">Editando: ${esc(t.nome)}</h3><div class="row"><button class="btn sm" onclick="ctDupTpl('${t.id}')">Duplicar</button>${L.length>1?`<button class="btn sm danger" onclick="ctExcluirTpl('${t.id}')">Excluir</button>`:''}</div></div>
    <div class="fg"><label class="f">Nome<input id="ctt_nome" value="${esc(t.nome)}"></label><label class="f">Tipo<select id="ctt_tipo">${Object.values(CT_TIPOS).map(x=>`<option value="${x.k}" ${x.k===t.tipo?'selected':''}>${x.ic} ${x.label}</option>`).join('')}</select></label><label class="f w2">Descrição<input id="ctt_desc" value="${esc(t.descricao||'')}"></label></div>
    <div class="resbox" style="margin:14px 0"><div class="row between" style="gap:10px"><div><b>📄 Template Word (.docx)</b><div class="small muted" style="margin-top:2px">${t.docx?`Ativo: <b>${esc(t.docx.nome)}</b> (${Math.max(1,Math.round((t.docx.tamanho||0)/1024))} KB · ${fdata(t.docx.atualizadoEm)}). O .docx do contrato sai deste arquivo com os campos preenchidos.`:'Sem arquivo: o .docx sai no layout padrão Delta (logo, CNPJ, tabelas e rodapé).'} Linhas de tabela com {{item_...}} ou {{parcela_...}} são repetidas por item.</div></div>
      <div class="row" style="gap:6px"><label class="btn sm pri" style="cursor:pointer">⬆ ${t.docx?'Trocar':'Importar'} .docx<input type="file" accept=".docx" style="display:none" onchange="ctUploadDocx('${t.id}',this)"></label><button class="btn sm" onclick="ctModeloDocx('${t.id}')">⬇ Modelo .docx editável</button>${t.docx?`<button class="btn sm danger" onclick="ctRmDocx('${t.id}')">✕ Remover</button>`:''}</div></div></div>
    <details class="resbox" style="margin:0 0 12px"><summary class="small" style="cursor:pointer;font-weight:700">Inserir campo ({{...}}) no ponto do cursor</summary><div class="ct-vars" style="margin-top:8px">${CT_VARS_LIST.flatMap(([,a])=>a).map(v=>`<button type="button" onmousedown="event.preventDefault()" onclick="ctInserirVar('${v}')">${v}</button>`).join('')}</div></details>
    <div class="ct-cl-ed"><div class="ct-cl-top"><span class="ct-ord">TÍTULO</span><input class="ct-cl-t" id="ctt_titulo" value="${esc(t.titulo)}"></div><textarea id="ctt_pre" rows="5">${esc(t.preambulo)}</textarea></div>
    ${(t.clausulas||[]).map((cl,i)=>`<div class="ct-cl-ed"><div class="ct-cl-top"><span class="ct-ord">${CT_ORD[i]||i+1}</span><input class="ct-cl-t" data-ti="${i}" value="${esc(cl.titulo)}"><button class="btn sm" ${i?'':'disabled'} onclick="ctTplMover(${i},-1)">↑</button><button class="btn sm" ${i<t.clausulas.length-1?'':'disabled'} onclick="ctTplMover(${i},1)">↓</button><button class="btn sm danger" onclick="ctTplRm(${i})">✕</button></div><textarea data-tx="${i}" rows="${Math.min(14,Math.max(4,Math.ceil(String(cl.texto).length/95)))}">${esc(cl.texto)}</textarea></div>`).join('')}
    <button class="btn" onclick="ctTplAdd()">+ Cláusula</button>
    <div class="ct-cl-ed" style="margin-top:12px"><div class="ct-cl-top"><span class="ct-ord">FECHO</span></div><textarea id="ctt_fecho" rows="3">${esc(t.fecho||'')}</textarea></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="ctTplPrevia('${t.id}')">👁 Prévia com exemplo</button><button class="btn pri" onclick="ctSalvarTpl('${t.id}')">Salvar modelo</button></div>
  </div>`);
  const b=document.getElementById('tplbody');b.addEventListener('focusin',e=>{if(e.target.matches('textarea,input.ct-cl-t'))ctCampoAtivo=e.target});
}
function ctLerTplForm(t){const g=id=>document.getElementById(id);t.nome=g('ctt_nome').value.trim()||t.nome;t.tipo=g('ctt_tipo').value;t.descricao=g('ctt_desc').value.trim();t.titulo=g('ctt_titulo').value;t.preambulo=g('ctt_pre').value;t.fecho=g('ctt_fecho').value;
  document.querySelectorAll('[data-ti]').forEach(i=>t.clausulas[+i.dataset.ti].titulo=i.value);document.querySelectorAll('[data-tx]').forEach(i=>t.clausulas[+i.dataset.tx].texto=i.value)}
function ctSalvarTpl(id){const t=ctTemplateDe(id);ctLerTplForm(t);save();toast('Modelo salvo — vale para os próximos contratos');viewCTemplates()}
function ctTplMover(i,d){const t=ctTemplateDe(ctTplEdit);ctLerTplForm(t);const a=t.clausulas,j=i+d;[a[i],a[j]]=[a[j],a[i]];save();viewCTemplates()}
function ctTplRm(i){const t=ctTemplateDe(ctTplEdit);ctLerTplForm(t);t.clausulas.splice(i,1);save();viewCTemplates()}
function ctTplAdd(){const t=ctTemplateDe(ctTplEdit);ctLerTplForm(t);t.clausulas.push({titulo:'NOVA CLÁUSULA',texto:''});save();viewCTemplates()}
function ctNovoTpl(){const b=JSON.parse(JSON.stringify(defaultCtTemplates()[1]));b.id='ctt_'+uid();b.nome='Novo modelo '+(ctTemplates().length+1);b.tipo='outro';b.descricao='Modelo personalizado';b.docx=null;ctTemplates().push(b);ctTplEdit=b.id;save();viewCTemplates()}
function ctDupTpl(id){const o=ctTemplateDe(id);const b=JSON.parse(JSON.stringify(o));b.id='ctt_'+uid();b.nome=o.nome+' (cópia)';ctTemplates().push(b);ctTplEdit=b.id;save();viewCTemplates()}
function ctExcluirTpl(id){if(!confirm('Excluir este modelo? Contratos já criados não mudam.'))return;S.cfg.ctTemplates=ctTemplates().filter(t=>t.id!==id);save();viewCTemplates()}
function ctRestaurarTpls(){if(!confirm('Restaurar os 3 modelos padrão? Modelos com o mesmo nome padrão serão substituídos; os seus personalizados continuam.'))return;const pad=defaultCtTemplates();S.cfg.ctTemplates=pad.concat(ctTemplates().filter(t=>!pad.some(p=>p.id===t.id)));save();viewCTemplates();toast('Modelos padrão restaurados')}
function ctExemploDe(t){const p=S.propostas.find(x=>x.status!=='rascunho'&&((x.tipoProposta==='eletrica')===(t.tipo==='eletrica')));let c;try{c=p?ctDeProposta(p.id,t.id):ctNovoBase(t)}catch(e){c=ctNovoBase(t)}
  Object.assign(c,{templateId:t.id,tipo:t.tipo,titulo:t.titulo,preambulo:t.preambulo,fecho:t.fecho,clausulas:JSON.parse(JSON.stringify(t.clausulas))});
  Object.assign(c.parte,{nome:c.parte.nome||'Cliente Exemplo',doc:c.parte.doc||'529.982.247-25',logradouro:'Rua Exemplo',numero:'100',bairro:'Centro',cidade:c.parte.cidade||'Pelotas',uf:'RS',cep:'96010-000'});c.codigo='CT-EXEMPLO';return c}
function ctTplPrevia(id){const t=ctTemplateDe(id);ctLerTplForm(t);const c=ctExemploDe(t);
  setHead('Prévia do modelo',t.nome+' · dados de exemplo',`<button class="btn" onclick="go('ctemplates')">← Voltar</button><button class="btn" onclick="window.print()">🖨️ Imprimir</button>`);V(ctPrevHtml(c))}
async function ctUploadDocx(id,input){
  const file=input&&input.files&&input.files[0];if(!file)return;if(!/\.docx$/i.test(file.name))return toast('Selecione um arquivo .docx');
  try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(file)});
    const z=await JSZip.loadAsync(b64,{base64:true});if(!z.file('word/document.xml'))throw new Error('arquivo .docx inválido');
    const xml=await z.file('word/document.xml').async('string');const usados=new Set();xml.replace(/<[^>]+>/g,'').replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g,(_,k)=>usados.add(k));
    const t=ctTemplateDe(id);const meta={nome:file.name,tamanho:file.size,atualizadoEm:todayISO(),campos:[...usados]};
    if(GAS){const r=await gas('salvarArquivo','Contratos',`Template-${id}-${file.name}`,'application/vnd.openxmlformats-officedocument.wordprocessingml.document',b64);meta.fileId=r.id;meta.url=r.url}
    else{meta.localKey='ct_'+id;await docxStorePut(meta.localKey,b64)}
    t.docx=meta;save();toast(`Template .docx importado (${usados.size} campo(s) {{...}} encontrados)`);viewCTemplates();
  }catch(e){toast('Erro ao importar: '+(e&&e.message||e))}
}
async function ctRmDocx(id){const t=ctTemplateDe(id);if(t.docx&&t.docx.localKey)await docxStoreDel(t.docx.localKey);t.docx=null;save();viewCTemplates()}
async function ctModeloDocx(id){try{const t=ctTemplateDe(id);const c=ctExemploDe(t);c.codigo='{{contrato_numero}}';const r=ctRender(c,'modelo');
  const blob=await ctGerarDocx({codigo:'{{contrato_numero}}',render:r,empresa:{nome:S.cfg.empresa,cnpj:ctCfg().cnpj,crea:ctCfg().crea,email:ctCfg().email,site:S.cfg.site,whats:S.cfg.whats,whats2:S.cfg.whats2}},{},true);
  baixarBlob(blob,`Modelo-Contrato-${t.nome.replace(/[^a-zA-Z0-9]+/g,'-')}.docx`);toast('Modelo .docx baixado: edite no Word e importe de volta')}catch(e){toast('Erro: '+(e&&e.message||e))}}
/* ---- API para o Claude / MCP operar os contratos pela página ---- */
window.DeltaContratos={
  versao:'1.0',
  campos:()=>CT_VARS_LIST.map(([g,v])=>({grupo:g,campos:v})),
  templates:()=>ctTemplates().map(t=>({id:t.id,nome:t.nome,tipo:t.tipo,clausulas:t.clausulas.length,docx:!!t.docx})),
  listar:()=>ctLista().map(c=>({id:c.id,codigo:c.codigo,status:c.status,cliente:c.parte.nome,valor:ctTotal(c),templateId:c.templateId,propostaId:c.propostaId,link:linkContrato(c)})),
  obter:id=>JSON.parse(JSON.stringify(ctDe(id)||null)),
  variaveis:id=>{const c=ctDe(id);if(!c)return null;const v=ctVars(c);delete v.__rows;return v},
  faltando:id=>{const c=ctDe(id);return c?Object.assign(ctValidar(c),{campos:ctFaltando(c)}):null},
  texto:id=>{const c=ctDe(id);return c?ctTextoPlano(ctRender(c,'final')):null},
  criarDeProposta:(propostaId,templateId)=>{const c=ctDeProposta(propostaId,templateId);ctNumerar(c);ctLista().push(c);save();return c.id},
  criarManual:(dados,templateId)=>{const c=ctNovoBase(ctTemplateDe(templateId));ctAplicarPatch(c,dados||{});ctNumerar(c);logCt(c,'Criado via API');ctLista().push(c);save();return c.id},
  atualizar:(id,patch)=>{const c=ctDe(id);if(!c)throw new Error('contrato não encontrado');if(ctRO(c))throw new Error('contrato assinado: somente leitura');ctAplicarPatch(c,patch||{});logCt(c,'Atualizado via API');save();if(curHash()==='ct-'+id)viewContrato(id);return true},
  enviar:async id=>{await ctEnviar(id);closeModal();const c=ctDe(id);return {status:c.status,link:linkContrato(c)}},
  exportarDocx:id=>ctBaixarDocx(id),exportarPdf:id=>ctBaixarPdf(id),abrir:id=>go('ct-'+id)
};
function ctAplicarPatch(c,p){Object.keys(p).forEach(k=>{const v=p[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&c[k]&&typeof c[k]==='object'&&!Array.isArray(c[k]))Object.assign(c[k],v);else c[k]=v})}
</script>

function validDoc(v){
  const d=String(v||'').replace(/\D/g,'');
  if(!d)return true;
  if(/^(\d)\1+$/.test(d))return false;
  if(d.length===11){let s=0;for(let i=0;i<9;i++)s+=+d[i]*(10-i);let r=(s*10)%11%10;if(r!=+d[9])return false;s=0;for(let i=0;i<10;i++)s+=+d[i]*(11-i);r=(s*10)%11%10;return r==+d[10]}
  if(d.length===14){const c=(b)=>{let w=b.length-7,s=0;for(let i=0;i<b.length;i++){s+=+b[i]*w--;if(w<2)w=9}const r=s%11;return r<2?0:11-r};return c(d.slice(0,12))==+d[12]&&c(d.slice(0,13))==+d[13]}
  return false;
}

function addMonths(iso,n){const [y,m,d]=iso.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10)}

const KV={db:null};
function kvOpen(){return new Promise(res=>{if(KV.db)return res(KV.db);if(typeof indexedDB==='undefined')return res(null);
  let r;try{r=indexedDB.open('deltaErpDB',1)}catch(e){return res(null)}
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};
  r.onsuccess=()=>{KV.db=r.result;res(KV.db)};r.onerror=()=>res(null)})}
async function kvGet(k){const db=await kvOpen();if(!db)return undefined;return new Promise(res=>{try{const q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
async function kvSet(k,v){const db=await kvOpen();if(!db)throw new Error('IndexedDB indisponível');
  return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Gravação cancelada'))})}
let _salvando=false,_salvarDeNovo=false;
async function salvarLocal(){
  if(_salvando){_salvarDeNovo=true;return}
  _salvando=true;
  try{do{_salvarDeNovo=false;const j=JSON.stringify(S);
    try{await kvSet('S',j);mem=null;avisoSalvar(false)}
    catch(e){try{localStorage.setItem('deltaErpV1',j);mem=null;avisoSalvar(false)}catch(e2){mem=j;avisoSalvar(true)}}
  }while(_salvarDeNovo)}finally{_salvando=false}
}
function avisoSalvar(falhou){
  let d=document.getElementById('avisoSalvar');
  if(!falhou){if(d)d.remove();return}
  if(d)return;
  d=document.createElement('div');d.id='avisoSalvar';d.setAttribute('role','alert');
  d.innerHTML='<b>Não foi possível salvar neste navegador.</b> As alterações estão só na memória e somem ao fechar a aba. <button class="btn sm" onclick="exportar()">Exportar backup agora</button>';
  document.body.appendChild(d);
}
function save(){
  if(!GAS){salvarLocal();return}
  syncPend=true;setSync('Alterações pendentes…');clearTimeout(save._t);save._t=setTimeout(flush,700);
}
async function flush(){
  if(!GAS||!lastSync)return;
  const ch={upserts:{},deletes:{},config:null};let n=0;
  COLS.forEach(c=>{const prev=lastSync[c]||{},seen={};
    (S[c]||[]).forEach(o=>{const j=JSON.stringify(o);seen[o.id]=1;if(prev[o.id]!==j){(ch.upserts[c]=ch.upserts[c]||[]).push(o);n++}});
    Object.keys(prev).forEach(id=>{if(!seen[id]){(ch.deletes[c]=ch.deletes[c]||[]).push(id);n++}})});
  if(cfgBlob()!==lastSync._cfg){ch.config={cfg:S.cfg,seq:S.seq,tecnicos:S.tecnicos};n++}
  if(!n){syncPend=false;setSync('Salvo ✓');return}
  const antes=lastSync;markSynced();setSync('Salvando…');
  try{
    const r=await gas('salvarAlteracoes',ch);
    // números atribuídos pelo servidor (propostas/contratos), sem gerar nova gravação
    (r&&r.nums||[]).forEach(x=>{const o=(S[x.col]||[]).find(y=>y.id===x.id);if(o){o.num=x.num;if(x.codigo){o.codigo=x.codigo;if(o.snap)o.snap.codigo=x.codigo}if(o.snap)o.snap.num=x.num;lastSync[x.col][o.id]=JSON.stringify(o)}});
    if(r&&r.nums&&r.nums.length&&curHash().startsWith('prop'))route();
    syncPend=false;syncErr=false;setSync((window.DELTA_SERVIDOR?'Salvo no servidor ✓ ':'Salvo na planilha ✓ ')+new Date().toLocaleTimeString('pt-BR').slice(0,5));
  }catch(e){lastSync=antes;syncErr=true;setSync('Erro ao salvar. Tentando de novo…',true);toast('Erro ao salvar: '+(e&&e.message||e));clearTimeout(save._t);save._t=setTimeout(flush,6000)}
}

async function load(){
  let r=null;try{r=await kvGet('S')}catch(e){}
  if(!r){ // migração automática do localStorage (versões antigas) para o IndexedDB
    try{r=localStorage.getItem('deltaErpV1')}catch(e){}
    if(r){try{await kvSet('S',r);localStorage.removeItem('deltaErpV1')}catch(e){}}
  }
  if(r){try{S=JSON.parse(r);migrar();return}catch(e){}}
  novosDados();save();
}
function migrar(){ // completa campos novos em dados antigos
  const d=seed();S.cfg=Object.assign({},d.cfg,S.cfg||{});
  if(S.cfg.endereco&&S.cfg.endereco.indexOf('96010-480')>=0)S.cfg.endereco=S.cfg.endereco.replace('96010-480','96010-470');
  if(!S.cfg.whats3)S.cfg.whats3='(53) 920000-5258';
  if(!S.cfg.templates||!S.cfg.templates.length)S.cfg.templates=defaultTemplates();
  else if(!S.cfg.templates.some(t=>t.id==='carnegie')){const ct=defaultTemplates().find(t=>t.id==='carnegie');if(ct)S.cfg.templates.push(ct)}
  S.cfg.precificacao=Object.assign({modoPadrao:'margem',markupPadrao:50,precoWpPadrao:3.5,parcelaFin:0,parcelaPrazo:60},S.cfg.precificacao||{});
  S.cfg.ct=Object.assign(ctCfgPadrao(),S.cfg.ct||{});if(!S.cfg.ctTemplates||!S.cfg.ctTemplates.length)S.cfg.ctTemplates=defaultCtTemplates();
  S.seq=S.seq||{prop:100,contrato:1};S.tecnicos=S.tecnicos&&S.tecnicos.length?S.tecnicos:d.tecnicos;
  COLS.forEach(c=>S[c]=S[c]||[]);S.seq.ct=S.seq.ct||0;
  if(!GAS&&!S.seq.ctEx){S.seq.ctEx=1;try{ctExemploSeed()}catch(e){}}
  S.kits.forEach(k=>{if(k.invKw==null){const m=/(\d+[\.,]?\d*)\s*kW/.exec(k.inversor||'');k.invKw=m?num(m[1].replace(',','.')):0}});
  S.propostas.forEach(p=>{
    if(!p.tipoProposta){const kit=S.kits.find(k=>k.id===p.kitId);p.tipoProposta=(kit&&num(kit.backupKw)>0)||(p.cargas&&p.cargas.length)?'hibrido':'ongrid'}
    if(!p.templateId)p.templateId='executivo';
    p.modoPreco=modoPrecoDe(p);
    if(p.status&&p.status!=='rascunho'&&!p.parametros)p.parametros=parametrosDe(p);
    if(!Array.isArray(p.imagens))p.imagens=[];
    p.imagens=normalizarImagens(p.imagens);
    if(p.snap&&Array.isArray(p.snap.imagens))p.snap.imagens=normalizarImagens(p.snap.imagens).filter(temImg);
  });
  if(S.cfg&&Array.isArray(S.cfg.templates))S.cfg.templates.forEach(t=>{if(Array.isArray(t.imagensPadrao))t.imagensPadrao=normalizarImagens(t.imagensPadrao)});
  if(!GAS&&!S.propostas.some(p=>p.templateId==='carnegie')){
    const exCar=d.propostas.find(p=>p.templateId==='carnegie');
    if(exCar){exCar.num=Math.max(104,(S.seq.prop||103)+1);S.seq.prop=exCar.num;S.propostas.push(exCar);try{exemplos()}catch(e){}}
  }
}
async function loadGas(){

  const r=await gas('carregarTudo');USER=r.usuario||'';LINKS=r.links||{};PERFIL_GAS=r.perfil||null;
  const urlSrv=r.urlPublica||''; // servidor Docker informa a própria URL pública
  setTimeout(()=>{if(urlSrv&&S&&S.cfg&&!S.cfg.urlPublica){S.cfg.urlPublica=urlSrv;save()}},0);
  const vazio=COLS.every(c=>!(r.dados[c]||[]).length)&&!r.config;
  if(vazio){novosDados();COLS.forEach(c=>{if(c!=='kits')S[c]=[]});markSynced();lastSync=Object.fromEntries(COLS.map(c=>[c,{}]));lastSync._cfg='';return 'vazio'}
  S=Object.assign({},r.config||{});COLS.forEach(c=>S[c]=r.dados[c]||[]);migrar();markSynced();setSync('Sincronizado ✓');
  setTimeout(ctSyncGas,1500);
}

function fioBPct(ano){const t=S.cfg.fioBPct;const ks=Object.keys(t).map(Number).sort();if(ano<=ks[0])return t[ks[0]]/100;for(let i=ks.length-1;i>=0;i--)if(ano>=ks[i])return t[ks[i]]/100;return 1}

}

/* ---- Precificação: 6 formas de formar o preço final. Cada orçamento escolhe a sua; as regras padrão ficam na aba Precificação ---- */
const MODOS_PRECO={
  margem:{label:'Margem sobre o custo',desc:'Você informa a margem desejada; o sistema calcula o preço a partir do custo dos itens.'},
  total:{label:'Valor total fechado',desc:'Você digita o preço final; o sistema mostra a margem e o lucro resultantes.'},
  markup:{label:'Markup sobre o custo',desc:'Preço = custo × (1 + markup). Comissão e impostos entram por cima do preço.'},
  wp:{label:'Preço por Wp',desc:'Preço = potência do sistema (Wp) × R$/Wp. Bom para comparar propostas de tamanhos diferentes.'},
  tabela:{label:'Tabela do kit',desc:'Usa o preço de tabela cadastrado no kit escolhido, ajustado pelo número de módulos.'},
  parcela:{label:'Parcela desejada',desc:'Você informa a parcela que o cliente aceita; o sistema calcula quanto ela financia, e esse é o preço.'}
};
function modoPrecoDe(p){let m=(p&&p.modoPreco)||'margem';if(m==='preco')m='total';return MODOS_PRECO[m]?m:'margem'}
/* Preço antes do arredondamento. x = {diretos, com, imp, kwp, nMod} */
function precoPorModo(p,x){
  const m=modoPrecoDe(p),base=Math.max(0.05,1-x.com-x.imp);
  switch(m){
    case 'total':return num(p.preco);
    case 'markup':return x.diretos*(1+num(p.markup)/100)/base;
    case 'wp':return x.kwp*1000*num(p.precoWp);
    case 'tabela':{const k=S.kits.find(y=>y.id===p.kitId);const vt=cfgVivo(p).kits?cfgVivo(p).kits[p.kitId]:(k&&k.precoTabela);if(!k||!num(vt)||!k.nMod)return 0;return num(vt)*(x.nMod/k.nMod)}
    case 'parcela':{const q=p.parcela||{},f=cfgVivo(p).financeiras[+q.fin];const pmt=num(q.valor),n=Math.max(1,Math.round(num(q.prazo)||60));
      if(!f||pmt<=0)return 0;const i=num(f.taxa)/100,iof=num((cfgVivo(p).iof||{})[f.tipo||'PF'])/100;
      const pv=i>0?pmt*(1-Math.pow(1+i,-n))/i:pmt*n;return num(p.entrada)+pv/(1+iof)}
    default:return x.diretos/Math.max(0.05,1-x.com-x.imp-num(p.margem)/100);
  }
}

const PERFIL_GRUPO={B1:'res',B2:'rural',B3:'com'};

function opcaoDe(p,id){return (p.opcoes||[]).find(o=>o.id===id)}
/* A opção A é a própria proposta; B e C substituem kit, itens, preço e bateria */
function pEfetiva(p,opId){
  if(!opId||opId==='A')return p;
  const o=opcaoDe(p,opId);if(!o)return p;
  return Object.assign({},p,{kitId:o.kitId||'',itens:o.itens||[],nModManual:o.nModManual??'',modoPreco:p.modoPreco,margem:o.margem??p.margem,preco:o.preco??0,desconto:o.desconto??0,bateriaKwh:o.bateriaKwh??''});
}
function perdasDet(p){
  if(p.pTemp===undefined){const t=num(p.perdas);return {det:false,itens:[['Perdas totais',t]],pr:1-t/100,total:t}}
  const it=[['Temperatura dos módulos',p.pTemp],['Sujeira',p.pSujeira],['Sombreamento',p.pSombra],['Cabos CC/CA',p.pCabos],['Inversor',p.pInv],['Descasamento e outras',p.pOutras]];
  const pr=it.reduce((a,[,v])=>a*(1-num(v)/100),1);
  return {det:true,itens:it,pr,total:(1-pr)*100};
}
/* Fator de orientação: aproximação geométrica (azimute como desvio do norte, inclinação em graus).
   TODO-VERIFICAR contra PVGIS/PVsyst para Pelotas antes de usar em contratos. */
function fatorOrient(p){
  if(p.azim===undefined)return num(p.orientacao)/100;
  const lat=Math.abs(num(S.cfg.lat)||31.77),b=Math.max(0,Math.min(90,num(p.incl))),az=Math.min(180,Math.abs(num(p.azim)));
  const perdaT=Math.min(.6,0.00013*Math.pow(b-lat,2));
  const k=Math.min(.45,.30*b/30);
  const perdaA=k*(1-Math.cos(az*Math.PI/180))/2;
  return Math.max(.3,(1-perdaT)*(1-perdaA));
}
function tirDe(cf){
  const npv=r=>cf.reduce((a,v,i)=>a+v/Math.pow(1+r,i),0);
  let lo=-0.9,hi=5;if(npv(lo)*npv(hi)>0)return null;
  for(let i=0;i<80;i++){const m=(lo+hi)/2;if(npv(lo)*npv(m)<=0)hi=m;else lo=m}
  return (lo+hi)/2;
}
/* Fluxo de caixa de 25 anos para um reajuste de tarifa r */
function simFluxo(p,x,r){
  const ano0=new Date().getFullYear(),deg=num(p.degradacao)/100,d1=p.degrad1===undefined?0:num(p.degrad1)/100;
  const s=p.simult===undefined?0:Math.min(100,Math.max(0,num(p.simult)))/100;
  const inf=p.inflacao===undefined?0:num(p.inflacao)/100;
  const om0=p.omPct===undefined?0:x.final*num(p.omPct)/100;
  const trAno=p.trocaInvAno===undefined?0:Math.round(num(p.trocaInvAno));
  const trVal=(p.trocaInvValor!==undefined&&p.trocaInvValor!=='')?num(p.trocaInvValor):x.invCusto;
  let acum=-x.final,payback=null,credito=0,econ1=0,cs1=0,cc1=0,econBruta=0,liqTot=0,omTot=0,trTot=0;const fluxo=[];const cf=[-x.final];
  for(let y=0;y<25;y++){
    const t=num(p.tarifa)*Math.pow(1+r,y),fb=num(p.fioB)*Math.pow(1+r,y),pct=fioBPct(ano0+y),fd=(1-d1)*Math.pow(1-deg,y);
    let e=0,cs=0,cc=0;
    for(let m=0;m<12;m++){
      const c=x.cons[m],g=x.gerMes[m]*fd;
      const auto=Math.min(g*s,c),inj=g-auto,need=c-auto;          // autoconsumo instantâneo não paga Fio B
      const disponivel=inj+credito,comp=Math.min(disponivel,need);
      credito=Math.min(disponivel-comp,x.consAno*2);               // banco de créditos (60 meses)
      const sem=Math.max(c,x.disp)*t,comS=Math.max(need-comp,x.disp)*t+comp*fb*pct;
      cs+=sem;cc+=comS;e+=sem-comS;
    }
    if(y===0){econ1=e;cs1=cs;cc1=cc}
    const om=om0*Math.pow(1+inf,y),tr=(trAno>0&&y===trAno-1)?trVal:0,liq=e-om-tr;
    const antes=acum;acum+=liq;econBruta+=e;liqTot+=liq;omTot+=om;trTot+=tr;cf.push(liq);
    if(payback===null&&acum>=0&&liq>0)payback=y+(-antes)/liq;
    fluxo.push({ano:ano0+y,econ:e,om,troca:tr,liq,acum});
  }
  const tma=num((p.tma!==undefined&&p.tma!==''?p.tma:S.cfg.cdi)||0)/100;
  const vpl=cf.reduce((a,v,i)=>a+v/Math.pow(1+tma,i),0);
  return {fluxo,payback,econ1,contaAtual:cs1/12,contaNova1:cc1/12,econBruta,liqTot,omTot,trTot,trVal,tir:tirDe(cf),vpl,tma};
}
function calcProp(p0,opId){
  const p=pEfetiva(p0,opId);
  const cfg=S.cfg;
  const cons=p.modoConsumo==='mensal'?p.consumoMes.map(num):Array(12).fill(num(p.consumoMedio));
  const consAno=cons.reduce((a,b)=>a+b,0),media=consAno/12;
  const disp=DISP[p.ligacao]||30;
  const pd=perdasDet(p),fo=fatorOrient(p);
  const fator=pd.pr*fo;
  const hsp=cfg.hsp.map(num);
  const kwhPorKwpAno=hsp.reduce((a,h,m)=>a+h*DIAS[m],0)*fator;
  const kwpNec=consAno>0&&kwhPorKwpAno>0?consAno*(num(p.cobertura)/100)/kwhPorKwpAno:0;
  const modWp=num(p.modWp)||610;
  const nModAuto=Math.ceil(kwpNec*1000/modWp);
  const nMod=num(p.nModManual)>0?Math.round(num(p.nModManual)):nModAuto;
  const kwp=nMod*modWp/1000;
  const gerMes=hsp.map((h,m)=>kwp*h*DIAS[m]*fator);
  const gerAno=gerMes.reduce((a,b)=>a+b,0);
  const atende=consAno?gerAno/consAno:0;
  const area=nMod*2.9;
  const grp={kit:0,estrutura:0,ca:0,servico:0,outro:0,inv:0};
  (p.itens||[]).forEach(it=>{const v=num(it.qtd)*num(it.custo);
    if(it.tipo==='Inversor')grp.inv+=v;
    if(['Kit','Módulo','Inversor','Bateria'].includes(it.tipo))grp.kit+=v;else if(it.tipo==='Estrutura')grp.estrutura+=v;else if(it.tipo==='Material CA')grp.ca+=v;else if(it.tipo==='Serviço')grp.servico+=v;else grp.outro+=v});
  const projeto=num(p.projeto),frete=num(p.frete);
  const diretos=grp.kit+grp.estrutura+grp.ca+grp.servico+grp.outro+projeto+frete;
  const com=num(p.comissao)/100,imp=num(p.impostos)/100;
  let preco=precoPorModo(p,{diretos,com,imp,kwp,nMod});
  preco=Math.round(preco/10)*10;
  const final=Math.max(0,preco-num(p.desconto));
  const comV=final*com,impV=final*imp,lucro=final-diretos-comV-impV,margemF=final?lucro/final:0;
  const porWp=kwp?final/(kwp*1000):0;
  const invCusto=grp.inv||grp.kit*0.12;
  const x={cons,consAno,gerMes,disp,final,invCusto};
  const r0=num(p.reajuste)/100;
  const base=simFluxo(p,x,r0);
  const cen=p.degrad1===undefined?[]:[['Conservador',0.04],['Base da proposta',r0],['Realista',0.07]].map(([nome,r])=>{const f=r===r0?base:simFluxo(p,x,r);return {nome,r,payback:f.payback,tir:f.tir,vpl:f.vpl,liqTot:f.liqTot}});
  // comparação com aplicações financeiras (líquidas de IR 15%)
  const cdiL=num(cfg.cdi||0)/100*(1-0.15),poup=num(cfg.poupanca||0)/100;
  const vf=(i)=>base.fluxo.reduce((a,f,y)=>a+f.liq*Math.pow(1+i,24-y),0); // economia reinvestida a taxa i
  const cmp={cdiL,poup,vfCdi:final*Math.pow(1+cdiL,25),vfPoup:final*Math.pow(1+poup,25),vfSolar:vf(cdiL)};
  // financiamento
  const fins=cfgVivo(p).financeiras.map(f=>{const i=num(f.taxa)/100;const tipo=f.tipo||'PF',iof=num((cfgVivo(p).iof||{})[tipo]);const pv=Math.max(0,final-num(p.entrada))*(1+iof/100);return {nome:f.nome,taxa:f.taxa,tipo,iof,op:String(f.prazos).split(',').map(x=>parseInt(x)).filter(x=>x>0).map(n=>({n,pmt:i>0?pv*i/(1-Math.pow(1+i,-n)):pv/n}))}});
  const kit=S.kits.find(k=>k.id===p.kitId);const invKw=kit?num(kit.invKw):0;const ccca=invKw?kwp/invKw:0;
  const bat=num(p.bateriaKwh)||(kit?num(kit.bateriaKwh):0);
  return {opId:opId||'A',invKw,ccca,cccaAlto:invKw>0&&ccca>num(S.cfg.ccca||1.3),cons,consAno,media,disp,kwpNec,nMod,nModAuto,kwp,gerMes,gerAno,atende,area,grp,projeto,frete,diretos,preco,final,comV,impV,lucro,margemF,porWp,
    pr:fator,pd,fo,simult:p.simult===undefined?0:num(p.simult),bat,backupKw:kit?num(kit.backupKw):0,kitNome:kit?kit.nome:'',inversor:kit?kit.inversor:'',invCusto,
    econ1:base.econ1,econMes:base.econ1/12,contaAtual:base.contaAtual,contaNova1:base.contaNova1,payback:base.payback,fluxo:base.fluxo,econBruta:base.econBruta,econTot:base.liqTot,omTot:base.omTot,trTot:base.trTot,trVal:base.trVal,tir:base.tir,vpl:base.vpl,tma:base.tma,cen,cmp,
    roi:final?base.liqTot/final:0,fins,abaixoMin:final>0&&margemF*100<cfgVivo(p).margemMin};
}

/* ---- Pacote 2: opções, backup, pagamento ---- */
const NOMES_OP={A:'Microinversores',B:'Híbrido pronto para bateria',C:'Híbrido com bateria'};
const CARGAS_PADRAO=[['Geladeira / freezer',150,1,10],['Iluminação (LED)',10,8,5],['Roteador e modem',15,1,24],['TV e decodificador',100,1,4],['Notebook / carregadores',60,2,5],['Bomba d\'água',750,1,1]];
function nomeOp(p,id){return id==='A'?(p.nomeA||NOMES_OP.A):((opcaoDe(p,id)||{}).nome||NOMES_OP[id])}
function listaOps(p){return ['A'].concat((p.opcoes||[]).map(o=>o.id))}
function pagtoDe(p){const b=S.cfg.pagto||{};return Object.assign({pixDesc:0,cartaoAte:12,cartaoJuros:0,formas:{pix:true,cartao:true,obra:true,fin:true},obra:[{nome:'Sinal',pct:30,dias:3},{nome:'Na instalação',pct:40,dias:30},{nome:'Na conexão',pct:30,dias:60}]},b,p.pagto||{})}
function pagtoOpcoes(p,final,fins){
  const g=pagtoDe(p),f=g.formas||{};const r={formas:f,pix:null,cartao:[],obra:[]};
  if(f.pix!==false)r.pix={desc:num(g.pixDesc),valor:Math.round(final*(1-num(g.pixDesc)/100)*100)/100};
  if(f.cartao!==false){const i=num(g.cartaoJuros)/100;for(const n of [1,3,6,10,12,18].filter(n=>n<=num(g.cartaoAte)||n===1)){const pmt=i>0&&n>1?final*i/(1-Math.pow(1+i,-n)):final/n;r.cartao.push({n,pmt,total:pmt*n})}}
  if(f.obra!==false)r.obra=(g.obra||[]).map(o=>({nome:o.nome,pct:num(o.pct),dias:num(o.dias),valor:Math.round(final*num(o.pct))/100}));
  r.fin=f.fin!==false?fins:[];
  return r;
}
/* Backup: cargas essenciais → energia por dia, potência de pico e autonomia de cada opção */
function calcBackup(p){
  const cg=(p.cargas||[]).filter(c=>num(c.w)>0&&num(c.qtd)>0);
  const Edia=cg.reduce((a,c)=>a+num(c.w)*num(c.qtd)*num(c.h)/1000,0),Ppk=cg.reduce((a,c)=>a+num(c.w)*num(c.qtd),0)/1000;
  const H=num(p.horasQueda)||8,stby=num(S.cfg.standbyW||40)/1000,pmed=cg.length?Edia/24+stby:0;
  const opcs=listaOps(p).map(id=>{const c=calcProp(p,id);const util=c.bat*0.9;const aut=pmed>0?util/pmed:0;
    return {id,nome:nomeOp(p,id),bat:c.bat,backupKw:c.backupKw,aut,okH:c.bat>0&&aut>=H,okPk:c.backupKw>=Ppk&&Ppk>0,temBackup:c.backupKw>0}});
  return {cg,Edia,Ppk,H,pmed,kwhNec:pmed*H/0.9,opcs};
}
/* Parcela × economia mês a mês (por ano), com a economia crescendo com o reajuste da tarifa */
function parcelaEco(c,pmt,n){
  const anos=Math.ceil(n/12),linhas=[];let acum=0;
  for(let y=0;y<anos;y++){const meses=Math.min(12,n-y*12);const eco=(c.fluxo[y]?c.fluxo[y].econ:0)/12;const saldo=eco-pmt;acum+=saldo*meses;linhas.push({ano:y+1,eco,pmt,saldo,acum})}
  return linhas;
}
function addOpcao(pid,id){const p=S.propostas.find(x=>x.id===pid);if(opcaoDe(p,id))return;
  (p.opcoes=p.opcoes||[]).push({id,nome:NOMES_OP[id],kitId:'',itens:[],nModManual:'',modoPreco:'margem',margem:p.margem,preco:0,desconto:0,bateriaKwh:''});
  p.opcoes.sort((a,b)=>a.id<b.id?-1:1);
  const k=S.kits.find(k=>id==='C'?num(k.bateriaKwh)>0:(num(k.backupKw)>0&&!num(k.bateriaKwh)));if(k)aplicarKitOp(pid,id,k.id,true);
  save();viewProposta(pid)}

function aplicarKitOp(pid,id,kid,quiet){
  const p=S.propostas.find(x=>x.id===pid),o=opcaoDe(p,id),k=S.kits.find(x=>x.id===kid);if(!o||!k)return;

}

function etapaStatus(u){
  if(u.etapa>=4)return ['n','Concluída',0];
  const prazo=S.cfg.prazosUsina[u.etapa]||0;const dias=daysBetween(u.etapaDesde,todayISO());
  if(!prazo)return ['g','',dias];
  const f=dias/prazo;return [f>1?'r':f>.7?'a':'g',`${dias} de ${prazo} dias`,dias];
}
function leituras(u){
  // Monitoramento SIMULADO: gera 7 dias determinísticos a partir do kWp, da HSP e do fator mockRatio
  const out=[];const fator=(1-S.cfg.perdas/100);
  for(let i=6;i>=0;i--){const d=addDays(todayISO(),-i);const m=+d.slice(5,7)-1;const esp=u.kwp*S.cfg.hsp[m]*fator;
    const seedN=(d.split('-').join('')*1+u.kwp*100)%97/97;const clima=0.82+seedN*0.3;
    out.push({d,esp,real:esp*clima*(u.mockRatio??1),clima})}
  const esp=out.reduce((a,x)=>a+x.esp*x.clima,0),real=out.reduce((a,x)=>a+x.real,0);
  return {dias:out,ratio:esp?real/esp:0,hoje:out[6].real,potAgora:(()=>{const hr=new Date().getHours()+new Date().getMinutes()/60;const sol=Math.max(0,Math.sin(Math.PI*(hr-6)/13));return u.kwp*1000*0.8*sol*(u.mockRatio??1)})()};
}

function setField(p,f,v){
  if(f.startsWith('cm')){p.consumoMes[+f.slice(2)]=v;return}
  if(f.startsWith('it.')){const [,i,k]=f.split('.');p.itens[+i][k]=v;return}
  if(f.startsWith('hsp')){S.cfg.hsp[+f.slice(3)]=num(v);return}
  if(f.startsWith('op.')){const [,id,k]=f.split('.');const o=opcaoDe(p,id);if(o)o[k]=v;return}
  if(f.startsWith('cg.')){const [,i,k]=f.split('.');p.cargas[+i][k]=v;return}
  if(f.startsWith('po.')){const [,i,k]=f.split('.');ensurePagto(p).obra[+i][k]=v;return}
  if(f.startsWith('pg.')){const k=f.slice(3);const g=ensurePagto(p);if(k.startsWith('f_'))(g.formas=g.formas||{})[k.slice(2)]=!!v&&v!=='false';else g[k]=v;return}
  if(f.startsWith('parcela.')){p.parcela=Object.assign({fin:0,prazo:60,valor:0},p.parcela||{});p.parcela[f.slice(8)]=v;return}
  p[f]=v;
  if(f==='perfil')p.simult=simultPadrao(v);
}

}

function aceitarLocal(pid,nome,opId,forma){
  const p=S.propostas.find(x=>x.id===pid);const s=p.snap||snapshotProp(p);const t=todayISO();
  if(p.status==='aceita')return;
  const op=opsDe(s).find(x=>x.id===opId)||opsDe(s)[0];
  p.status='aceita';p.aceite={nome,quando:new Date().toLocaleString('pt-BR'),data:t,agente:navigator.userAgent.slice(0,80),opcao:op.id,forma:forma||'obra'};logP(p,`Aceita online por ${nome} · opção ${op.id} (${op.nome}) · ${formaNome(op,forma)}`);
  let cli=S.clientes.find(x=>x.id===p.clienteId);
  if(!cli){cli={id:uid(),nome:p.nome,doc:p.doc,fone:p.fone,email:p.email,cidade:p.cidade,uf:p.uf,aniversario:''};S.clientes.push(cli);p.clienteId=cli.id}
  const ehEl=(p.tipoProposta==='eletrica')||(s&&s.tipoProposta==='eletrica');
  const u={id:uid(),nome:`${ehEl?'Elétrica':({B1:'Residencial',B2:'Rural',B3:'Comercial'}[p.grupo]||'Usina')} — ${p.nome}`,clienteNome:p.nome,clienteId:cli.id,cidade:p.cidade,kwp:ehEl?0:+(+op.kwp).toFixed(2),nMod:ehEl?0:op.nMod,modWp:ehEl?0:op.modWp,inversor:ehEl?(op.nome||'Serviço elétrico'):op.inversor,etapa:0,etapaDesde:t,garantia:'',propostaId:p.id,monitor:{plataforma:'',planta:''},mockRatio:1};
  S.usinas.push(u);
  const tits=titulosDoAceite(s,op,forma);tits.forEach(x=>S.titulos.push({id:uid(),tipo:'receber',desc:`${x.desc} — ${p.nome}`,pessoa:p.nome,valor:x.valor,venc:addDays(t,x.dias),pago:false,propostaId:p.id}));
  S.visitas.push({id:uid(),usinaId:u.id,local:u.nome,tipo:ehEl?'Vistoria técnica elétrica':'Visita técnica comercial',data:addDays(t,3),tecnico:S.tecnicos[0],status:'agendada',checklist:[],obs:''});
  const n=S.negocios.find(x=>x.id===p.negocioId);if(n){n.status='ganho';n.fechadoEm=t;n.valor=Math.round(op.final);n.kwp=ehEl?0:+(+op.kwp).toFixed(2)}
  save();toast(`Proposta aceita (opção ${op.id}): cliente, obra, ${tits.length} título(s) a receber e a visita técnica foram criados`);
}

function salvarTemplate(id,tipo){
  S.cfg.templates=templatesLista();
  const tpl=S.cfg.templates.find(t=>t.id===id);if(!tpl)return;
  const g=k=>document.getElementById(k);
  const prev=(tpl.versoes&&tpl.versoes[tipo])||{};
  tpl.nome=g('te_nome').value.trim()||tpl.nome;
  tpl.estilo=g('te_estilo').value;
  tpl.descricao=g('te_desc').value.trim();
  tpl.versoes=tpl.versoes||{};
  tpl.versoes[tipo]=Object.assign({},prev,{
    tag:g('tv_tag').value.trim(),cta:g('tv_cta').value.trim(),
    titulo:g('tv_titulo').value.trim(),subtitulo:g('tv_subtitulo').value.trim(),
    intro:g('tv_intro').value.trim(),
    diferenciais:g('tv_dif').value.split('\n').map(s=>s.trim()).filter(Boolean),
    escopoExtra:g('tv_escopo').value.trim(),garantias:g('tv_gar').value.trim(),
    mostrarCen:g('tv_cen').checked,mostrarCdi:g('tv_cdi').checked,
    mostrarCron:g('tv_cron').checked,mostrarObras:g('tv_obras').checked,
    docx:prev.docx||null
  });
  save();toast('Template salvo');viewTemplates();
}
async function uploadTplImg(tplId,idx,input){
  const file=input&&input.files&&input.files[0];if(!file)return;
  S.cfg.templates=templatesLista();
  const tpl=S.cfg.templates.find(t=>t.id===tplId);if(!tpl)return;
  try{
    toast(GAS?'Enviando imagem para o Drive…':'Otimizando imagem padrão…');
    const novo=await prepararImagem(file);
    if(!Array.isArray(tpl.imagensPadrao))tpl.imagensPadrao=[];
    tpl.imagensPadrao[idx]=Object.assign(novo,{legenda:(tpl.imagensPadrao[idx]&&tpl.imagensPadrao[idx].legenda)||file.name.replace(/\.[^.]+$/,'')});
    save();toast('Imagem padrão '+(idx+1)+' salva no template');viewTemplates();
  }catch(e){toast('Erro ao carregar imagem: '+(e&&e.message||e))}
}

function docxOpenDb(){
  return new Promise((res,rej)=>{
    if(typeof indexedDB==='undefined')return res(null);
    const req=indexedDB.open('deltaSolarDocxDB',1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files')};
    req.onsuccess=()=>res(req.result);req.onerror=()=>res(null);
  });
}
async function docxStorePut(key,b64){
  const db=await docxOpenDb();
  if(db){return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(b64,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
  try{localStorage.setItem('deltaDocx_'+key,b64)}catch(e){throw new Error('Sem espaço no navegador para armazenar este arquivo .docx.')}
}
async function docxStoreGet(key){
  const db=await docxOpenDb();
  if(db){return new Promise((res)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}
  try{return localStorage.getItem('deltaDocx_'+key)}catch(e){return null}
}
async function docxStoreDel(key){
  const db=await docxOpenDb();
  if(db){return new Promise((res)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(key);tx.oncomplete=()=>res();tx.onerror=()=>res()})}
  try{localStorage.removeItem('deltaDocx_'+key)}catch(e){}
}

    titulo:tv.titulo||'Proposta Comercial',subtitulo:tv.subtitulo||'',introducao:tv.intro||'',

    formas_pagamento:formas.join('\n'),lista_itens:itens.join('\n'),lista_opcoes:opLinhas.join('\n'),lista_diferenciais:difs.join('\n'),
    garantias:ehEl?(s.elGarantia||tv.garantias||pa.garantias||''):(tv.garantias||pa.garantias||''),

const xesc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function substituirVarsXml(xmlStr,vars){
  const dp=new DOMParser(),doc=dp.parseFromString(xmlStr,'application/xml');
  if(doc.getElementsByTagName('parsererror').length){
    return xmlStr.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g,(_,k)=>k in vars?xesc(vars[k]):'');
  }
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  /* Linhas repetidoras (contratos): uma linha de tabela com {{item_...}} ou {{parcela_...}} é clonada para cada item */
  if(vars.__rows){
    Array.from(doc.getElementsByTagNameNS(W,'tr')).forEach(tr=>{
      const txt=Array.from(tr.getElementsByTagNameNS(W,'t')).map(t=>t.textContent).join('');
      const m=/\{\{\s*(item|parcela)_[a-z0-9_]+\s*\}\}/i.exec(txt);if(!m)return;
      const rows=vars.__rows[m[1].toLowerCase()]||[];
      rows.forEach(r=>{const cl=tr.cloneNode(true);substituirVarsNo(cl,Object.assign({},vars,r),W);tr.parentNode.insertBefore(cl,tr)});
      tr.parentNode.removeChild(tr);
    });
  }
  substituirVarsNo(doc,vars,W);
  return new XMLSerializer().serializeToString(doc);
}
function substituirVarsNo(doc,vars,W){
  const ps=doc.getElementsByTagNameNS(W,'p');
  for(let i=0;i<ps.length;i++){
    const ts=Array.from(ps[i].getElementsByTagNameNS(W,'t'));
    if(!ts.length)continue;
    const full=ts.map(t=>t.textContent).join('');
    if(full.indexOf('{{')<0)continue;
    const novo=full.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g,(_,k)=>(k in vars&&typeof vars[k]!=='object')?String(vars[k]):'');
    if(novo===full)continue;
    const primeiro=ts[0];
    for(let j=1;j<ts.length;j++)ts[j].textContent='';
    const linhas=novo.split('\n');
    primeiro.setAttribute('xml:space','preserve');
    primeiro.textContent=linhas[0];
    if(linhas.length>1){
      const r=primeiro.parentNode;
      for(let l=1;l<linhas.length;l++){
        const od=doc.ownerDocument||doc;
        r.appendChild(od.createElementNS(W,'w:br'));
        const t2=od.createElementNS(W,'w:t');
        t2.setAttribute('xml:space','preserve');
        t2.textContent=linhas[l];
        r.appendChild(t2);
      }
    }
  }
}
async function preencherDocxBase64(b64,vars){
  if(typeof JSZip==='undefined')throw new Error('Biblioteca JSZip não carregou. Verifique sua conexão com a internet.');
  const zip=await JSZip.loadAsync(b64,{base64:true});
  const alvos=Object.keys(zip.files).filter(f=>/^word\/(document|header\d*|footer\d*)\.xml$/i.test(f));
  for(const f of alvos){
    const xml=await zip.file(f).async('string');
    zip.file(f,substituirVarsXml(xml,vars));
  }
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* Dentro do Claude (artefato) o navegador bloqueia downloads diretos: usa a capacidade "downloads", que pede confirmação ao usuário
   (no app do celular abre a folha de compartilhamento — dá para mandar direto no WhatsApp ou e-mail). Fora dele, download normal. */
async function baixarBlob(blob,nome){
  try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){try{await d.save({filename:nome,data:blob})}catch(e){if(e&&e.code!=='declined')toast('Não foi possível salvar o arquivo ('+(e.code||e.message||e)+')')}return}}}catch(e){}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
}

    const tplLive=templateDe(s.templateId||(s.tpl&&s.tpl.id));

    let blob=null;

    }

async function uploadTemplateDocx(tplId,tipo,input){
  const file=input&&input.files&&input.files[0];if(!file)return;
  if(!/\.docx$/i.test(file.name))return toast('Selecione um arquivo no formato .docx (Microsoft Word).');
  if(file.size>12*1024*1024)return toast('Arquivo muito grande (máx. 12 MB).');
  try{
    toast('Carregando template .docx…');
    const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result||'').split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(file)});
    if(typeof JSZip!=='undefined'){
      const z=await JSZip.loadAsync(b64,{base64:true});
      if(!z.file('word/document.xml'))throw new Error('Arquivo .docx inválido (word/document.xml não encontrado).');
    }
    S.cfg.templates=templatesLista();
    const tpl=S.cfg.templates.find(t=>t.id===tplId);if(!tpl)return;
    tpl.versoes=tpl.versoes||{};
    tpl.versoes[tipo]=Object.assign({},versaoTemplateDe(tplId,tipo));
    const meta={nome:file.name,tamanho:file.size,atualizadoEm:todayISO()};
    if(GAS){
      const r=await gas('salvarArquivo','Propostas',`Template-${tplId}-${tipo}-${file.name}`,'application/vnd.openxmlformats-officedocument.wordprocessingml.document',b64);
      meta.fileId=r.id;meta.url=r.url;
    }else{
      const key=`${tplId}_${tipo}`;
      await docxStorePut(key,b64);
      meta.localKey=key;
    }
    tpl.versoes[tipo].docx=meta;
    save();toast('Template .docx salvo e vinculado à versão '+TIPOS_PROP[tipo].curto+'!');
    viewTemplates();
  }catch(e){toast('Erro ao importar .docx: '+(e&&e.message||e))}

let sigDirty=false;
function initSig(){const c=document.getElementById('sig');const r=c.getBoundingClientRect();c.width=r.width;c.height=r.height;const x=c.getContext('2d');x.lineWidth=2;x.lineCap='round';x.strokeStyle='#13221e';let d=false;sigDirty=false;
  const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{d=true;x.beginPath();x.moveTo(...pos(e));c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!d)return;x.lineTo(...pos(e));x.stroke();sigDirty=true};c.onpointerup=()=>d=false}
function clearSig(){const c=document.getElementById('sig');c.getContext('2d').clearRect(0,0,c.width,c.height);sigDirty=false}
/* ---- Imagens (proposta e template) ----
   Formato gravado: {data:'data:image/jpeg;base64,…', legenda} no navegador
                    {fileId, mime, legenda} no Google (arquivo na pasta Propostas do Drive). */
const IMG_VAZIA='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const IMGCACHE={};
function dataUrl(d){if(!d)return '';if(typeof d==='string')return d;if(d.b64)return 'data:'+(d.mime||'image/jpeg')+';base64,'+d.b64;return ''}
function temImg(im){return !!(im&&(dataUrl(im.data)||im.fileId))}
function imgAttr(im){const d=dataUrl(im&&im.data);if(d)return `src="${d}"`;if(im&&im.fileId){const c=IMGCACHE[im.fileId];return c?`src="${c}"`:`src="${IMG_VAZIA}" data-fid="${esc(im.fileId)}" data-mime="${esc(im.mime||'image/jpeg')}" class="img-carregando"`}return `src="${IMG_VAZIA}"`}
function carregarImagensDrive(){
  if(!GAS)return;
  document.querySelectorAll('img[data-fid]:not([data-pedida])').forEach(img=>{
    const id=img.dataset.fid;img.dataset.pedida='1';
    const pronto=src=>{document.querySelectorAll(`img[data-fid="${id}"]`).forEach(i=>{i.src=src;i.classList.remove('img-carregando')})};
    if(IMGCACHE[id])return pronto(IMGCACHE[id]);
    gas('lerArquivoBase64',id).then(b64=>{IMGCACHE[id]='data:'+(img.dataset.mime||'image/jpeg')+';base64,'+b64;pronto(IMGCACHE[id])},()=>{img.alt='Imagem indisponível';img.classList.remove('img-carregando')});
  });
}
async function prepararImagem(file){
  if(!/^image\/(png|jpeg|webp)$/.test(file.type))throw new Error('use JPG, PNG ou WEBP');
  const r=await reduzirImagem(file,1000,0.75);
  const data='data:'+r.mime+';base64,'+r.b64;
  if(GAS){const up=await gas('salvarArquivo','Propostas',`Imagem ${todayISO()} ${Date.now()}.jpg`,r.mime,r.b64);IMGCACHE[up.id]=data;return {fileId:up.id,mime:r.mime}}
  return {data};
}
function normalizarImagens(lista){return Array.isArray(lista)?lista.map(im=>{if(!im)return im;if(im.data&&typeof im.data!=='string'){const d=dataUrl(im.data);return d?Object.assign({},im,{data:d}):null}return im}):lista}
function reduzirImagem(file,max=1600,q=0.8){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=()=>res({mime:file.type,b64:String(fr.result).split(',')[1]});im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({mime:'image/jpeg',b64:c.toDataURL('image/jpeg',q).split(',')[1]})};im.src=fr.result};fr.readAsDataURL(file)})}
async function concluirOS(vid){
  const v=S.visitas.find(x=>x.id===vid);const items=CHECKLISTS[v.tipo]||[];
  const cks=[...document.querySelectorAll('.ck')].map(c=>c.checked);
  if(cks.some(x=>!x)&&!confirmPend){confirmPend=true;return toast('Há itens do checklist sem marcar. Clique em Concluir de novo para confirmar.')}
  confirmPend=false;
  const files=[...document.getElementById('os_fotos').files];const quando=new Date().toLocaleString('pt-BR');
  const sigUrl=sigDirty?document.getElementById('sig').toDataURL('image/png'):'';
  const obs=document.getElementById('os_obs').value;
  let fotos=files.map(f=>({nome:f.name,quando})),assinatura=sigUrl;
  if(GAS&&(files.length||sigUrl)){
    const btn=document.querySelector('#mbox .btn.ok');if(btn){btn.disabled=true;btn.textContent='Enviando arquivos para o Drive…'}
    try{
      const base=`${fdata(v.data).split('/').reverse().join('-')} ${v.local}`.replace(/[\\/:*?"\u003c\u003e|]/g,'-');
      fotos=[];for(let i=0;i<files.length;i++){const r=await reduzirImagem(files[i]);const up=await gas('salvarArquivo','Fotos',`${base} - foto ${i+1}.jpg`,r.mime,r.b64);fotos.push({nome:files[i].name,quando,url:up.url,fileId:up.id})}
      if(sigUrl){const up=await gas('salvarArquivo','Assinaturas',`${base} - assinatura.png`,'image/png',sigUrl.split(',')[1]);assinatura=up.url}
    }catch(e){if(btn){btn.disabled=false;btn.textContent='✓ Concluir OS'}return toast('Falha ao enviar arquivos: '+(e&&e.message||e))}
  }
  v.checklist=items.map((it,i)=>({it,ok:cks[i]}));v.obs=obs;v.fotos=fotos;v.assinatura=assinatura;
  v.status='concluida';v.concluidaEm=quando;
  if(v.contratoId){const c=S.contratos.find(x=>x.id===v.contratoId);if(c){c.proxima=addDays(v.data,c.ciclo);c.ultima=v.data}}
  save();closeModal();toast(v.contratoId?'OS concluída. A próxima visita do contrato foi calculada.':'OS concluída');route();

function gerarPendentes(){
  const t=todayISO();let n=0;
  S.contratos.filter(c=>c.situacao==='Ativo').forEach(c=>{
    if(addDays(c.proxima,-c.antecedencia)>t)return;
    if(S.visitas.some(v=>v.contratoId===c.id&&v.status!=='concluida'))return;
    const u=S.usinas.find(x=>x.id===c.usinaId);
    S.visitas.push({id:uid(),usinaId:c.usinaId,local:u?u.nome:c.clienteNome,tipo:c.tipo,data:c.proxima,tecnico:c.tecnico,status:'agendada',contratoId:c.id,checklist:[],obs:''});
    S.titulos.push({id:uid(),tipo:'receber',desc:`${c.tipo} — ${c.clienteNome} (contrato ${c.num})`,pessoa:c.clienteNome,valor:c.valor,venc:c.proxima,pago:false});n++});
  save();toast(n?`${n} visita(s) e título(s) gerado(s)`:'Nenhuma visita pendente: as que estão dentro da antecedência já foram geradas');route();
}

function importarArquivo(input){
  const f=input.files&&input.files[0];if(!f)return;
